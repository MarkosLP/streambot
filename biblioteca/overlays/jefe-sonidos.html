<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de sonidos de jefes</title>
<style>
  body { max-width: 900px; margin: 32px auto; padding: 0 18px; background: #11131b; color: #f4ead8; font: 16px/1.5 system-ui, sans-serif; }
  h1 { margin-bottom: 4px; } p { color: #c6bdad; }
  .controles { display: flex; align-items: center; gap: 14px; margin: 22px 0; }
  input { width: 180px; }
  .fila { display: grid; grid-template-columns: minmax(180px, 1fr) auto auto auto; align-items: center; gap: 10px; border-top: 1px solid #35333a; padding: 12px 0; }
  button, a { box-sizing: border-box; padding: 8px 12px; border: 1px solid #9b7b4b; border-radius: 5px; background: #29232a; color: #f4ead8; font: inherit; cursor: pointer; text-decoration: none; text-align: center; }
  button:hover, a:hover { background: #473349; }
  button:focus-visible, a:focus-visible { outline: 3px solid #d5ae6c; }
  #estado { min-height: 24px; }
  @media (max-width: 650px) { .fila { grid-template-columns: 1fr 1fr; } .fila strong { grid-column: 1 / -1; } }
</style>
</head>
<body>
<h1>Sonidos de los jefes</h1>
<p>Escucha la entrada y el ataque especial de cada jefe. Esta prueba suena solo en este navegador: no lanza un combate ni cambia OBS o el chat.</p>
<div class="controles"><label for="volumen">Volumen</label><input id="volumen" type="range" min="0" max="100" value="35"><output id="nivel">35 %</output></div>
<div id="lista"></div>
<p id="estado" role="status"></p>
<script>
'use strict';
const SONIDOS_JEFES = Object.freeze({
  dragon: { entrada: 'jefe-dragon-entrada.ogg', especial: 'jefe-dragon-especial.ogg' },
  esqueleto: { entrada: 'jefe-esqueleto-entrada.ogg', especial: 'jefe-esqueleto-especial.ogg' },
  hidra: { entrada: 'jefe-hidra-entrada.ogg', especial: 'jefe-hidra-especial.ogg' },
  golem: { entrada: 'jefe-golem-entrada.ogg', especial: 'jefe-golem-especial.ogg' },
  liche: { entrada: 'jefe-liche-entrada.ogg', especial: 'jefe-liche-especial.ogg' },
  arana: { entrada: 'jefe-arana-entrada.ogg', especial: 'jefe-arana-especial.ogg' },
  kraken: { entrada: 'jefe-kraken-entrada.ogg', especial: 'jefe-kraken-especial.ogg' },
  minotauro: { entrada: 'jefe-minotauro-entrada.ogg', especial: 'jefe-minotauro-especial.ogg' },
  tanque: { entrada: 'jefe-tanque-entrada.ogg', especial: 'jefe-tanque-especial.ogg' },
  lag: { entrada: 'jefe-lag-entrada.ogg', especial: 'lag.wav' },
});
const nombres = {
  dragon: 'Dragón de Escarcha', esqueleto: 'Rey Esqueleto', hidra: 'Hidra del Pantano',
  golem: 'Gólem de Obsidiana', liche: 'Liche sin Nombre', arana: 'Araña Reina',
  kraken: 'Kraken del Foso', minotauro: 'Minotauro con Resaca',
  tanque: 'Tanque que no sabe tanquear', lag: 'Lag Primigenio',
};
const volumen = document.getElementById('volumen');
const estado = document.getElementById('estado');
let actual;
volumen.addEventListener('input', () => {
  document.getElementById('nivel').textContent = `${volumen.value} %`;
  if (actual) actual.volume = Number(volumen.value) / 100;
});
function escuchar(tipo, momento) {
  if (actual) { actual.pause(); actual.currentTime = 0; }
  actual = new Audio(`../sonidos/${SONIDOS_JEFES[tipo][momento]}`);
  actual.volume = Number(volumen.value) / 100;
  estado.textContent = `${nombres[tipo]}: ${momento === 'entrada' ? 'entrada' : 'ataque especial'}`;
  actual.play().catch(() => { estado.textContent = 'No se pudo reproducir el archivo de audio.'; });
}
for (const tipo of Object.keys(nombres)) {
  const fila = document.createElement('div'); fila.className = 'fila';
  const nombre = document.createElement('strong'); nombre.textContent = nombres[tipo];
  const entrada = document.createElement('button'); entrada.textContent = '▶ Entrada'; entrada.onclick = () => escuchar(tipo, 'entrada');
  const especial = document.createElement('button'); especial.textContent = '▶ Especial'; especial.onclick = () => escuchar(tipo, 'especial');
  const demo = document.createElement('a'); demo.href = `jefe.html?demo=1&jefe=${tipo}&volumen=0.35`; demo.textContent = 'Ver combate';
  fila.append(nombre, entrada, especial, demo); document.getElementById('lista').append(fila);
}
</script>
</body>
</html>
