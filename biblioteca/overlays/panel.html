<!doctype html>
<!--
  Panel rotativo, para OBS (27 sep 2026). Fuente «OVL Panel», de 480×140:
  una caja pequeña que rota entre próximo cofre, líder de Loot, último follow,
  último sub y meta. Los botines, canjes y jefes recientes entran unos segundos.
  Lo que aún no tiene datos se salta.

  Pensado para las escenas del juego: las del panel (✦) ya enseñan el podio.
  Qué sale, orden, ritmo, marco, opacidad y meta: panel → Overlays.
  Datos: GET /api/overlay/panel (core/alertas.ts + Loot + temporada).

    ?demo=1   con datos de mentira; marco=pergamino|cristal|estandarte
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600&family=Fraunces:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Orbitron:wght@600&family=Bangers&family=Press+Start+2P&display=swap">
<style>
  html, body { margin: 0; width: 480px; height: 140px; overflow: hidden; background: transparent; }
  body { position: relative; }
  body { font-family: "Inter", "Segoe UI", sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
    --acento: #e8a24a; --nombre: "Fraunces", Georgia, serif; --opacidad: .72; }
  body.e-alegre { --acento: #6ee7ff; }
  body.e-acogedor { --acento: #f3b37a; }
  body.m-pergamino { --metal: #e1b965; --tinta: #143a40; --suave: #385451; --placa: rgba(8, 55, 62, .95);
    --panel: linear-gradient(90deg, rgba(5, 49, 57, var(--opacidad)) 0 24%, rgba(233, 211, 163, var(--opacidad)) 25%, rgba(252, 241, 209, var(--opacidad)) 60%, rgba(225, 198, 144, var(--opacidad)) 100%); }
  body.m-cristal { --metal: #d8bb75; --tinta: #fff2d3; --suave: #d2e0d5; --placa: rgba(8, 33, 40, .94);
    --panel: linear-gradient(110deg, rgba(4, 49, 58, var(--opacidad)) 0 24%, rgba(10, 48, 58, var(--opacidad)) 25%, rgba(5, 27, 39, var(--opacidad)) 80%, rgba(15, 54, 60, var(--opacidad))); }
  body.m-estandarte { --metal: #e3b96b; --tinta: #fff0cf; --suave: #e2d8ba; --placa: rgba(14, 45, 50, .94);
    --panel: linear-gradient(90deg, rgba(5, 48, 54, .12) 0 23%, rgba(7, 55, 61, var(--opacidad)) 27%, rgba(6, 36, 43, var(--opacidad)) 100%); }
  .caja { position: absolute; inset: 8px 10px; box-sizing: border-box; overflow: hidden;
    background: var(--panel); border: 2px solid var(--metal); border-radius: 12px;
    box-shadow: inset 0 0 0 2px rgba(7, 47, 53, .92), inset 0 0 0 5px rgba(245, 213, 145, .55), 0 8px 20px rgba(0, 0, 0, .48), 0 0 12px rgba(224, 177, 86, .25);
    transition: opacity .8s ease; }
  .caja.vacia { opacity: 0; }
  .caja::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(255, 231, 170, .65); border-radius: 6px; pointer-events: none;
    background: radial-gradient(circle at 100% 0, rgba(255, 243, 184, .3), transparent 17%), radial-gradient(circle at 0 100%, rgba(255, 243, 184, .2), transparent 17%); }
  .caja::after { content: "✦"; position: absolute; right: 13px; top: 2px; color: var(--metal); font-size: 17px; text-shadow: 0 0 8px rgba(255, 222, 140, .8); }
  .vista { position: absolute; inset: 11px 22px; display: grid; align-content: center; gap: 3px;
    opacity: 0; transform: translateY(10px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .8, .2, 1); }
  .vista.ve { opacity: 1; transform: none; }
  .vista.sale { opacity: 0; transform: translateY(-8px); }
  .etq { justify-self: start; max-width: 100%; box-sizing: border-box; padding: 4px 16px 4px 12px; font-size: 10px; line-height: 1.2; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: #f7dfa3; background: var(--placa); border: 1px solid var(--metal); clip-path: polygon(0 0, 96% 0, 100% 50%, 96% 100%, 0 100%, 4px 50%); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 2px 5px rgba(0, 0, 0, .35); }
  .grande { max-width: 100%; font-family: "Fraunces", Georgia, serif; font-size: 25px; font-weight: 600; line-height: 1.1; color: var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 1px rgba(0, 0, 0, .15); }
  .sub { box-sizing: border-box; max-width: 100%; justify-self: start; padding: 3px 10px; color: var(--suave); background: rgba(255, 247, 221, .28); border-bottom: 1px solid rgba(175, 132, 62, .5);
    font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .podio { display: flex; gap: 10px; font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; }
  .podio b { color: var(--tinta); font-weight: 600; }
  .barra { width: 100%; height: 7px; border-radius: 8px; background: rgba(22, 66, 73, .18); overflow: hidden; margin-top: 4px; }
  .barra i { display: block; height: 100%; width: 0; border-radius: 8px; background: var(--acento); box-shadow: 0 0 12px var(--acento); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); }
  /* Con emblema pintado (imagenes/emblemas): a la izquierda, y la etiqueta sin emoji. */
  .vista.con-emblema { grid-template-columns: 122px minmax(0, 1fr); column-gap: 10px; align-items: center; inset: 8px 22px 8px 7px; }
  .vista.con-emblema::before { content: ""; position: absolute; left: 1px; top: 50%; width: 98px; height: 98px; transform: translateY(-50%) rotate(45deg);
    border: 1px solid var(--metal); box-shadow: 0 0 0 2px rgba(7, 58, 65, .8), 0 0 14px rgba(255, 209, 118, .5); border-radius: 18px; pointer-events: none; }
  .vista.con-emblema > .cuerpo { display: grid; justify-items: center; gap: 5px; min-width: 0; width: 100%; align-content: center; text-align: center; }
  .vista.con-emblema .etq, .vista.con-emblema .sub { justify-self: center; }
  .emblema { position: relative; width: 94px; height: 94px; margin-left: 4px; border-radius: 50%; border: 3px solid var(--metal); box-sizing: border-box; object-fit: cover;
    box-shadow: 0 0 0 3px #0b3c43, 0 0 0 5px rgba(255, 220, 137, .8), 0 4px 14px rgba(0, 0, 0, .55), 0 0 20px rgba(105, 224, 224, .45); }
  .vista.ve .emblema { animation: emblema-entra .7s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes emblema-entra { from { opacity: 0; transform: scale(.5) rotate(-10deg); } }
  .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; }
  .fila .grande { font-size: 21px; }
  .cifra { font-family: "Fraunces", Georgia, serif; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--tinta); flex: none; }
  .m-cristal .sub, .m-estandarte .sub { color: #f3e3b8; background: rgba(6, 22, 28, .64); border-color: rgba(225, 185, 100, .7); }
  .m-cristal .caja { box-shadow: inset 0 0 0 2px rgba(2, 22, 28, .95), inset 0 0 0 5px rgba(90, 207, 209, .22), 0 8px 20px rgba(0, 0, 0, .6), 0 0 18px rgba(58, 206, 220, .48); }
  .m-cristal .caja::before { border-color: rgba(112, 224, 226, .7); }
  .m-pergamino .caja::after { content: ""; position: absolute; right: 0; top: 0; width: 20px; height: 100%;
    background: linear-gradient(90deg, rgba(8, 55, 62, .92), rgba(13, 78, 83, .86) 60%, rgba(8, 45, 52, .92));
    border-left: 2px solid var(--metal); clip-path: polygon(0 0, 100% 0, 72% 50%, 100% 100%, 0 100%, 18% 50%); }
  .m-estandarte .caja { border-radius: 42px 12px 12px 42px; box-shadow: inset 0 0 0 2px rgba(10, 40, 46, .7), 0 7px 17px rgba(0, 0, 0, .48); }
  .m-estandarte .caja::before { inset: 5px 7px 5px 101px; border-left: 0; border-radius: 4px; }
  .m-estandarte .vista.con-emblema::before { border-radius: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
<div class="caja vacia" id="caja"></div>
<script src="/red.js"></script>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const API = new URL('/api/overlay/panel', location.href);
const LETRAS = { moderna: '"Sora"', editorial: '"Fraunces"', elegante: '"Cormorant Garamond"', futurista: '"Orbitron"', pixel: '"Press Start 2P"', comic: '"Bangers"' };

function h(tag, clase, ...hijos) {
  const el = document.createElement(tag);
  if (clase) el.className = clase;
  for (const x of hijos) if (x !== null && x !== undefined) el.append(x instanceof Node ? x : document.createTextNode(String(x)));
  return el;
}

function haceCuanto(iso) {
  const min = Math.round((Date.now() - Date.parse(iso)) / 60_000);
  if (min < 60) return min <= 1 ? 'hace un momento' : `hace ${min} min`;
  const horas = Math.round(min / 60);
  return horas < 24 ? `hace ${horas} h` : `hace ${Math.round(horas / 24)} días`;
}

function ponerEstilo(estilo, ap) {
  for (const x of ['alegre', 'acogedor']) document.body.classList.toggle(`e-${x}`, estilo === x);
  const c = ap && ap.colores;
  if (c && /^#[0-9a-f]{6}$/i.test(c.principal)) {
    document.body.style.setProperty('--acento', c.principal);
    document.body.style.setProperty('--nombre', LETRAS[ap.letra] ? `${LETRAS[ap.letra]}, sans-serif` : '"Sora", sans-serif');
  } else {
    document.body.style.removeProperty('--acento');
    document.body.style.removeProperty('--nombre');
  }
}

// Emblemas pintados, cargados de antemano. Sin imagen, la vista como siempre.
// Si una falla (no existe), esa vista sale como siempre.
const PINTADOS = {};
for (const tipo of ['top', 'follow', 'sub', 'meta', 'raid', 'cofre']) {
  const im = new Image();
  PINTADOS[tipo] = im.src = tipo === 'top' ? '../imagenes/objetos/tesoro.png' : `../imagenes/emblemas/${tipo === 'cofre' ? 'regalo' : tipo}.png`;
  im.onerror = () => { delete PINTADOS[tipo]; };
}
/** Una vista: con emblema si lo hay (y entonces la etiqueta sin su emoji). */
function vista(tipo, emoji, etiqueta, ...resto) {
  if (!PINTADOS[tipo]) return h('div', 'vista', h('div', 'etq', `${emoji} ${etiqueta}`), ...resto);
  const img = h('img', 'emblema');
  img.src = PINTADOS[tipo];
  img.alt = '';
  return h('div', 'vista con-emblema', img, h('div', 'cuerpo', h('div', 'etq', etiqueta), ...resto));
}

/** Cada cosa que puede salir; null si aún no tiene datos. */
const VISTAS = {
  cofre(d) {
    const c = d.cofre;
    if (!c?.activo || c.quedanSeg === null) return null;
    const tiempo = c.quedanSeg < 60 ? `${c.quedanSeg} s` : `${Math.ceil(c.quedanSeg / 60)} min`;
    return vista('cofre', '🎁', c.deGuerra ? 'Cofre de guerra' : 'Próximo cofre',
      h('div', 'grande', `En ${tiempo}`),
      h('div', 'sub', `${c.participantes} ${c.participantes === 1 ? 'participante activo' : 'participantes activos'} · escribe en el chat`));
  },
  top(d) {
    const p = d.top;
    if (!p.podio.length) return null;
    return vista('top', '🏆', `Líder de Loot · ${p.nombre}`,
      h('div', 'grande', p.podio[0].nombre),
      h('div', 'sub', `${p.podio[0].puntos} puntos del mes · objetos, duelos y MVP`));
  },
  follow(d) {
    const f = d.ultimoFollow;
    if (!f) return null;
    return vista('follow', '❤', 'Último seguidor', h('div', 'grande', f.quien), h('div', 'sub', haceCuanto(f.at)));
  },
  sub(d) {
    const s = d.ultimoSub;
    if (!s) return null;
    return vista('sub', '★', 'Último sub', h('div', 'grande', s.quien), h('div', 'sub', `${s.texto} · ${haceCuanto(s.at)}`));
  },
  meta(d) {
    const m = d.meta;
    if (!m) return null;
    const barra = h('div', 'barra', h('i'));
    const pct = Math.min(100, (m.actual / Math.max(1, m.objetivo)) * 100);
    setTimeout(() => { barra.firstChild.style.width = `${pct}%`; }, 60);
    return vista('meta', '🎯', m.titulo,
      h('div', 'fila', h('div', 'grande', m.actual >= m.objetivo ? '¡Conseguida!' : `Faltan ${m.objetivo - m.actual}`), h('div', 'cifra', `${m.actual} / ${m.objetivo}`)),
      barra);
  },
};

function vistaNovedad(n) {
  const tipo = n.tipo === 'raid' ? 'raid' : n.tipo === 'jefe' ? 'top' : 'cofre';
  return vista(tipo, n.tipo === 'raid' ? '⚔️' : '🎁', n.titulo,
    h('div', 'grande', n.quien), h('div', 'sub', n.detalle));
}

function ponerMarco(marco, opacidad) {
  for (const x of ['pergamino', 'cristal', 'estandarte']) document.body.classList.toggle(`m-${x}`, marco === x);
  document.body.style.setProperty('--opacidad', String(Math.max(.45, Math.min(.95, Number(opacidad) || .72))));
}

let datos = null;
let turno = -1;
let temporizador = null;
let ultimaNovedad = 0;
const novedadesPendientes = [];

function mostrar() {
  clearTimeout(temporizador);
  if (!datos) return;
  const orden = datos.orden.filter((k) => VISTAS[k]);
  const caja = $('caja');
  // La siguiente que tenga datos (como mucho una vuelta).
  const novedad = novedadesPendientes.shift();
  let el = novedad ? vistaNovedad(novedad) : null;
  for (let i = 0; i < orden.length && !el; i++) {
    turno = (turno + 1) % orden.length;
    el = VISTAS[orden[turno]](datos);
  }
  caja.classList.toggle('vacia', !el);
  // TODAS las que haya se van (no solo «la visible»): si OBS o el navegador
  // congelan la página un rato, no se quedan varias una encima de otra.
  for (const vieja of caja.querySelectorAll('.vista:not(.sale)')) {
    vieja.classList.remove('ve');
    vieja.classList.add('sale');
    setTimeout(() => vieja.remove(), 700);
  }
  if (el) {
    caja.append(el);
    void el.offsetWidth; // que el navegador la pinte oculta antes de hacerla entrar
    el.classList.add('ve');
  }
  temporizador = setTimeout(mostrar, novedad ? (novedad.tipo === 'raid' ? 12_000 : 6500) : (datos.segundos || 12) * 1000);
}

function aplicar(d) {
  ponerEstilo(d.estilo, d.apariencia);
  const marco = ['pergamino', 'cristal', 'estandarte'].includes(q.get('marco')) ? q.get('marco') : d.marco || 'pergamino';
  const opacidad = q.has('opacidad') ? Number(q.get('opacidad')) / 100 : d.opacidad;
  ponerMarco(marco, opacidad);
  const primera = datos === null;
  const orden = q.has('orden') ? [...new Set(q.get('orden').split(',').filter(k => Object.hasOwn(VISTAS, k)))] : d.orden;
  const segundos = q.has('segundos') ? Math.max(5, Math.min(60, Number(q.get('segundos')) || 12)) : d.segundos;
  datos = { ...d, orden, segundos };
  for (const n of (d.novedades || []).filter(x => x.n > ultimaNovedad).sort((a, b) => a.n - b.n)) {
    ultimaNovedad = Math.max(ultimaNovedad, n.n);
    if (Date.now() - n.at < 15_000) novedadesPendientes.push(n);
  }
  if (novedadesPendientes.length > 8) novedadesPendientes.splice(0, novedadesPendientes.length - 8);
  if (primera || novedadesPendientes.length) mostrar();
}

function demo() {
  const hace = (min) => new Date(Date.now() - min * 60_000).toISOString();
  return {
    estilo: q.get('estilo') || 'oscuro',
    marco: ['pergamino', 'cristal', 'estandarte'].includes(q.get('marco')) ? q.get('marco') : 'pergamino',
    opacidad: q.has('opacidad') ? Number(q.get('opacidad')) / 100 : .72,
    orden: q.has('orden') ? [...new Set(q.get('orden').split(',').filter(k => Object.hasOwn(VISTAS, k)))] : ['cofre', 'top', 'follow', 'sub', 'meta'],
    segundos: q.has('segundos') ? Math.max(5, Math.min(60, Number(q.get('segundos')) || 12)) : 4,
    top: { nombre: 'septiembre', podio: [{ nombre: 'Ana_la_Tanque', puntos: 184 }, { nombre: 'raftaei', puntos: 131 }, { nombre: 'Pepe', puntos: 77 }] },
    cofre: { activo: true, quedanSeg: 495, participantes: 3, deGuerra: null },
    novedades: q.has('evento') ? [{ n: 1, at: Date.now(), tipo: 'botin', titulo: 'Cofre abierto', quien: 'Soichen', detalle: 'Espada de Fuego Eterno · +8 puntos del mes' }] : [],
    ultimoFollow: { quien: 'Sombra_22', at: hace(12) },
    ultimoSub: { quien: 'raftaei', texto: 'se resuscribe · 6 meses', at: hace(95) },
    meta: { titulo: 'Meta de subs del mes', actual: 7, objetivo: 10 },
  };
}

if (q.get('demo') === '1') {
  aplicar(demo());
} else {
  DirectoRed.overlay(API, aplicar, 5000);
}
</script>
</body>
</html>
