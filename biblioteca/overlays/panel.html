<!doctype html>
<!--
  Panel rotativo, para OBS (27 sep 2026). Fuente «OVL Panel», de 480×140:
  una caja pequeña que va cambiando cada pocos segundos entre el top de la
  temporada del Loot, el último follow, el último sub y la meta del mes. Lo
  que aún no tiene datos (nadie ha seguido todavía, sin meta…) se salta.

  Pensado para las escenas del juego: las del panel (✦) ya enseñan el podio.
  Qué sale, en qué orden, cuántos segundos y la meta: panel → Escenas →
  Overlays. Datos: GET /api/overlay/panel (core/alertas.ts + la temporada).
  Colores y letra, los del estilo de las escenas.

    ?demo=1   con datos de mentira
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600&family=Fraunces:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Orbitron:wght@600&family=Bangers&family=Press+Start+2P&display=swap">
<style>
  html, body { margin: 0; width: 480px; height: 140px; overflow: hidden; background: transparent; }
  body { position: relative; }
  body { font-family: "Inter", "Segoe UI", sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
    --acento: #e8a24a; --vidrio: rgba(8, 8, 12, .82); --nombre: "Cormorant Garamond", Georgia, serif; }
  body.e-alegre { --acento: #6ee7ff; --vidrio: rgba(12, 14, 36, .8); --nombre: "Sora", sans-serif; }
  body.e-acogedor { --acento: #f3b37a; --vidrio: rgba(30, 19, 12, .82); --nombre: "Fraunces", Georgia, serif; }
  .caja { position: absolute; inset: 10px; box-sizing: border-box; padding: 14px 22px; overflow: hidden;
    background: var(--vidrio); border: 1px solid rgba(255, 255, 255, .13); border-radius: 4px;
    transition: opacity .8s ease; }
  .caja.vacia { opacity: 0; }
  .caja::before { content: ""; position: absolute; left: 0; top: 0; width: 64px; height: 3px; background: var(--acento); }
  .vista { position: absolute; inset: 14px 22px; display: grid; align-content: center; gap: 4px;
    opacity: 0; transform: translateY(10px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .8, .2, 1); }
  .vista.ve { opacity: 1; transform: none; }
  .vista.sale { opacity: 0; transform: translateY(-8px); }
  .etq { font-size: 12px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--acento); }
  .grande { font-family: var(--nombre); font-size: 32px; font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 15px; color: rgba(255, 255, 255, .7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .podio { display: flex; gap: 16px; font-size: 15px; color: rgba(255, 255, 255, .72); white-space: nowrap; overflow: hidden; }
  .podio b { color: #fff; font-weight: 600; }
  .barra { height: 8px; border-radius: 8px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 4px; }
  .barra i { display: block; height: 100%; width: 0; border-radius: 8px; background: var(--acento); box-shadow: 0 0 12px var(--acento); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); }
  /* Con emblema pintado (imagenes/emblemas): a la izquierda, y la etiqueta sin emoji. */
  .vista.con-emblema { grid-template-columns: 76px minmax(0, 1fr); column-gap: 14px; align-items: center; inset: 8px 22px 8px 12px; }
  .vista.con-emblema > .cuerpo { display: grid; gap: 4px; min-width: 0; }
  .emblema { width: 84px; height: 84px; margin: -6px; object-fit: contain;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6)) drop-shadow(0 0 12px color-mix(in srgb, var(--acento) 55%, transparent)); }
  .vista.ve .emblema { animation: emblema-entra .7s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes emblema-entra { from { opacity: 0; transform: scale(.5) rotate(-10deg); } }
  .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .fila .grande { font-size: 26px; }
  .cifra { font-family: var(--nombre); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
</style>
</head>
<body>
<div class="caja vacia" id="caja"></div>
<script src="/red.js"></script>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const API = new URL('/api/overlay/panel', location.href);
const LETRAS = { moderna: '"Sora"', editorial: '"Fraunces"', elegante: '"Cormorant Garamond"', futurista: '"Orbitron"', pixel: '"Press Start 2P"', comic: '"Bangers"' };

function h(tag, clase, ...hijos) {
  const el = document.createElement(tag);
  if (clase) el.className = clase;
  for (const x of hijos) if (x !== null && x !== undefined) el.append(x instanceof Node ? x : document.createTextNode(String(x)));
  return el;
}

function haceCuanto(iso) {
  const min = Math.round((Date.now() - Date.parse(iso)) / 60_000);
  if (min < 60) return min <= 1 ? 'hace un momento' : `hace ${min} min`;
  const horas = Math.round(min / 60);
  return horas < 24 ? `hace ${horas} h` : `hace ${Math.round(horas / 24)} días`;
}

function ponerEstilo(estilo, ap) {
  for (const x of ['alegre', 'acogedor']) document.body.classList.toggle(`e-${x}`, estilo === x);
  const c = ap && ap.colores;
  if (c && /^#[0-9a-f]{6}$/i.test(c.principal)) {
    document.body.style.setProperty('--acento', c.principal);
    document.body.style.setProperty('--nombre', LETRAS[ap.letra] ? `${LETRAS[ap.letra]}, sans-serif` : '"Sora", sans-serif');
  } else {
    document.body.style.removeProperty('--acento');
    document.body.style.removeProperty('--nombre');
  }
}

// Emblemas pintados, cargados de antemano. Sin imagen, la vista como siempre.
// Si una falla (no existe), esa vista sale como siempre.
const PINTADOS = {};
for (const tipo of ['top', 'follow', 'sub', 'meta']) {
  const im = new Image();
  PINTADOS[tipo] = im.src = `../imagenes/emblemas/${tipo}.png`;
  im.onerror = () => { delete PINTADOS[tipo]; };
}
/** Una vista: con emblema si lo hay (y entonces la etiqueta sin su emoji). */
function vista(tipo, emoji, etiqueta, ...resto) {
  if (!PINTADOS[tipo]) return h('div', 'vista', h('div', 'etq', `${emoji} ${etiqueta}`), ...resto);
  const img = h('img', 'emblema');
  img.src = PINTADOS[tipo];
  img.alt = '';
  return h('div', 'vista con-emblema', img, h('div', 'cuerpo', h('div', 'etq', etiqueta), ...resto));
}

/** Cada cosa que puede salir; null si aún no tiene datos. */
const VISTAS = {
  top(d) {
    const p = d.top;
    if (!p.podio.length) return null;
    return vista('top', '🏆', `Temporada de ${p.nombre}`,
      h('div', 'grande', `${p.podio[0].nombre} · ${p.podio[0].puntos}`),
      p.podio.length > 1 ? h('div', 'podio', ...p.podio.slice(1).map((x, i) => h('span', null, `${i + 2}º `, h('b', null, x.nombre), ` ${x.puntos}`))) : h('div', 'sub', '¡Escribe en el chat y gana cofres!'));
  },
  follow(d) {
    const f = d.ultimoFollow;
    if (!f) return null;
    return vista('follow', '❤', 'Último seguidor', h('div', 'grande', f.quien), h('div', 'sub', haceCuanto(f.at)));
  },
  sub(d) {
    const s = d.ultimoSub;
    if (!s) return null;
    return vista('sub', '★', 'Último sub', h('div', 'grande', s.quien), h('div', 'sub', `${s.texto} · ${haceCuanto(s.at)}`));
  },
  meta(d) {
    const m = d.meta;
    if (!m) return null;
    const barra = h('div', 'barra', h('i'));
    const pct = Math.min(100, (m.actual / Math.max(1, m.objetivo)) * 100);
    setTimeout(() => { barra.firstChild.style.width = `${pct}%`; }, 60);
    return vista('meta', '🎯', m.titulo,
      h('div', 'fila', h('div', 'grande', m.actual >= m.objetivo ? '¡Conseguida!' : `Faltan ${m.objetivo - m.actual}`), h('div', 'cifra', `${m.actual} / ${m.objetivo}`)),
      barra);
  },
};

let datos = null;
let turno = -1;
let temporizador = null;

function mostrar() {
  clearTimeout(temporizador);
  if (!datos) return;
  const orden = datos.orden.filter((k) => VISTAS[k]);
  const caja = $('caja');
  // La siguiente que tenga datos (como mucho una vuelta).
  let el = null;
  for (let i = 0; i < orden.length && !el; i++) {
    turno = (turno + 1) % orden.length;
    el = VISTAS[orden[turno]](datos);
  }
  caja.classList.toggle('vacia', !el);
  // TODAS las que haya se van (no solo «la visible»): si OBS o el navegador
  // congelan la página un rato, no se quedan varias una encima de otra.
  for (const vieja of caja.querySelectorAll('.vista:not(.sale)')) {
    vieja.classList.remove('ve');
    vieja.classList.add('sale');
    setTimeout(() => vieja.remove(), 700);
  }
  if (el) {
    caja.append(el);
    void el.offsetWidth; // que el navegador la pinte oculta antes de hacerla entrar
    el.classList.add('ve');
  }
  temporizador = setTimeout(mostrar, (datos.segundos || 12) * 1000);
}

function aplicar(d) {
  ponerEstilo(d.estilo, d.apariencia);
  const primera = datos === null;
  datos = d;
  if (primera) mostrar();
}

function demo() {
  const hace = (min) => new Date(Date.now() - min * 60_000).toISOString();
  return {
    estilo: q.get('estilo') || 'oscuro', orden: ['top', 'follow', 'sub', 'meta'], segundos: 4,
    top: { nombre: 'septiembre', podio: [{ nombre: 'Ana_la_Tanque', puntos: 184 }, { nombre: 'raftaei', puntos: 131 }, { nombre: 'Pepe', puntos: 77 }] },
    ultimoFollow: { quien: 'Sombra_22', at: hace(12) },
    ultimoSub: { quien: 'raftaei', texto: 'se resuscribe · 6 meses', at: hace(95) },
    meta: { titulo: 'Meta de subs del mes', actual: 7, objetivo: 10 },
  };
}

if (q.get('demo') === '1') {
  aplicar(demo());
} else {
  DirectoRed.overlay(API, aplicar, 5000);
}
</script>
</body>
</html>
