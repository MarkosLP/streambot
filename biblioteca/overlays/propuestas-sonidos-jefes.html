<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prueba de sonido de jefes</title>
<style>body{max-width:820px;margin:32px auto;padding:0 18px;background:#11131b;color:#f4ead8;font:16px/1.5 system-ui,sans-serif}h1{margin-bottom:4px}p{color:#c6bdad}.control{display:flex;gap:12px;align-items:center;margin:20px 0}.grupo{border-top:1px solid #3c3941;padding:15px 0}.grupo h2{margin:0 0 8px;font-size:19px}.muestras{display:flex;flex-wrap:wrap;gap:8px}button{padding:9px 14px;background:#302830;color:inherit;border:1px solid #ab8958;border-radius:5px;font:inherit;cursor:pointer}button:hover{background:#493749}button:focus-visible{outline:3px solid #dab579}#estado{min-height:24px}</style></head>
<body><h1>Prueba de sonido de los diez jefes</h1><p>Los sonidos del dragón, el liche y el golpe del tanque ya están aprobados. Escucha las propuestas restantes antes de incorporarlas a los combates.</p>
<div class="control"><label for="volumen">Volumen</label><input id="volumen" type="range" min="0" max="100" value="35"><output id="nivel">35 %</output></div><div id="jefes"></div><p id="estado" role="status"></p>
<script>
'use strict';
const muestras = [
  ['Dragón de Escarcha', [['Rugido de entrada', 'propuesta-dragon-rugido.mp3'], ['Aliento de hielo', 'propuesta-dragon-hielo.wav'], ['Impacto de hielo', 'propuesta-dragon-hielo-impacto.wav']]],
  ['Rey Esqueleto', [['Entrada: huesos', 'jefe-esqueleto-entrada.ogg'], ['Especial: invocación', 'jefe-esqueleto-especial.ogg']]],
  ['Hidra del Pantano', [['Entrada: gruñido', 'jefe-hidra-entrada.ogg'], ['Especial: ácido', 'jefe-hidra-especial.ogg']]],
  ['Gólem de Obsidiana', [['Entrada: roca quebrándose', 'jefe-golem-entrada.ogg'], ['Especial: terremoto', 'terremoto.wav']]],
  ['Liche sin Nombre', [['Entrada: nigromancia', 'propuesta-liche-nigromancia.wav'], ['Especial: drenaje de alma', 'propuesta-liche-drenaje.wav']]],
  ['Araña Reina', [['Entrada: patas y mandíbulas', 'jefe-arana-entrada.ogg'], ['Especial: trampa de telaraña', 'jefe-arana-especial.ogg']]],
  ['Kraken del Foso', [['Entrada: emerge del agua', 'jefe-kraken-entrada.ogg'], ['Especial: arrastre bajo el agua', 'jefe-kraken-especial.ogg']]],
  ['Minotauro con Resaca', [['Entrada: bramido', 'jefe-minotauro-entrada.ogg'], ['Especial: arcada', 'jefe-minotauro-especial.ogg']]],
  ['Tanque que no sabe tanquear', [['Entrada: escudo mágico', 'jefe-tanque-entrada.ogg'], ['Especial: golpe contra metal', 'propuesta-tanque-escudo.wav']]],
  ['Lag Primigenio', [['Entrada: electricidad', 'jefe-lag-entrada.ogg'], ['Especial: fallo de conexión', 'lag.wav']]],
];
const caja = document.getElementById('jefes');
for (const [nombre, sonidos] of muestras) {
  const grupo = document.createElement('section'); grupo.className = 'grupo';
  const titulo = document.createElement('h2'); titulo.textContent = nombre; grupo.append(titulo);
  const botones = document.createElement('div'); botones.className = 'muestras';
  for (const [etiqueta, archivo] of sonidos) { const boton = document.createElement('button'); boton.textContent = `▶ ${etiqueta}`; boton.dataset.archivo = archivo; botones.append(boton); }
  grupo.append(botones); caja.append(grupo);
}
const volumen = document.getElementById('volumen');
const estado = document.getElementById('estado');
let actual;
volumen.addEventListener('input', () => { document.getElementById('nivel').textContent = `${volumen.value} %`; if (actual) actual.volume = Number(volumen.value) / 100; });
for (const boton of document.querySelectorAll('button[data-archivo]')) boton.addEventListener('click', () => {
  if (actual) { actual.pause(); actual.currentTime = 0; }
  actual = new Audio(`../sonidos/${boton.dataset.archivo}`);
  actual.volume = Number(volumen.value) / 100;
  estado.textContent = `Suena: ${boton.textContent.slice(2)}`;
  actual.play().catch(() => { estado.textContent = 'No se pudo reproducir esta muestra.'; });
  const esta = actual; setTimeout(() => { if (actual === esta && !esta.paused) esta.pause(); }, 5000);
});
</script></body></html>
