<!doctype html>
<!--
  Avatar para cuando no hay cámara (27 sep 2026): un personaje pintado con IA
  (panel → Escenas → Crear otro personaje), sobre fondo TRANSPARENTE, para
  ponerlo en cualquier escena como si fuera la cámara (una esquina de la
  escena del juego, por ejemplo). El dibujado con vectores se quitó: siempre
  es una imagen, y si el estilo aún no tiene personaje, sale el errante.

  Se enciende y se apaga desde el panel (Escenas → «Sin cámara»): con el
  avatar apagado esta página es transparente, así que la fuente puede quedarse
  siempre en OBS. Se escala sola al tamaño de la fuente (mejor cuadrada).

    ?siempre=1           se ve aunque el avatar esté apagado en el panel
    ?bocadillo=0         sin bocadillo
    ?bocadillo=todo      con el texto del panel siempre, y las reacciones
    (por defecto)        solo las reacciones: al chat, al botín
    ?fondo=1             con fondo (lo usa la escena Charla)
    ?estilo=alegre       fuerza un estilo (vistas previas); si no, el del panel
    ?demo=1              datos de mentira y reacciones de prueba

  Qué hace: respira, parpadea, mira de vez en cuando; cuando alguien escribe
  mira hacia el chat; con el botín se alegra (y se sorprende si es
  legendario); a los 90 s sin chat se queda dormido.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@500;600&display=swap">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body.fondo { background:
    radial-gradient(55% 60% at 72% 30%, rgba(255, 165, 90, .14), transparent 70%),
    radial-gradient(70% 60% at 20% 90%, rgba(90, 120, 200, .10), transparent 70%),
    linear-gradient(180deg, #0f0d15, #050408); }
  body.fondo.e-alegre { background:
    radial-gradient(55% 55% at 70% 35%, rgba(110, 231, 255, .22), transparent 70%),
    radial-gradient(70% 60% at 20% 95%, rgba(255, 126, 182, .22), transparent 70%),
    linear-gradient(180deg, #0a0f2e, #2a2168); }
  body.fondo.e-acogedor { background:
    radial-gradient(55% 55% at 70% 35%, rgba(243, 179, 122, .25), transparent 70%),
    linear-gradient(180deg, #160f0b, #46291d); }
  /* Los estilos propios: sus colores (--c1 principal, --c2 secundario, --c3/--c4 el cielo). */
  body.fondo.e-propio { background:
    radial-gradient(55% 55% at 70% 35%, color-mix(in srgb, var(--c1) 28%, transparent), transparent 70%),
    linear-gradient(180deg, var(--c3), color-mix(in srgb, var(--c3) 50%, var(--c4))); }
  #escena { position: absolute; inset: 0; transition: opacity 1.2s ease, filter 1.2s ease; }
  #escena.fuera { opacity: 0; filter: blur(12px); }
  #particulas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* El personaje. Entre imágenes solo cambia la zona que cambia de verdad
     (ojos, y la sonrisa si la hay): el resto no se mueve al parpadear. */
  .retrato { position: absolute; left: 50%; bottom: 0; height: 100%; aspect-ratio: 1; max-width: 100%; transform: translateX(-50%); }
  .retrato .salto, .retrato .gira, .retrato .mueve { position: absolute; inset: 0; }
  .retrato .gira { transition: transform 1.1s cubic-bezier(.3, 1.3, .4, 1); }
  .retrato .mueve { transform-origin: 50% 100%; animation: respira 5.2s ease-in-out infinite; }
  @keyframes respira { 50% { transform: scale(1.008, 1.018); } }
  .retrato img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .retrato .variante { opacity: 0; transition: opacity .1s linear; }
  /* El parpadeo en tres pasos (medio → cerrados → medio), cada uno ~45 ms:
     con fundidos largos se verían los dos párpados a la vez. */
  #r-medio { -webkit-mask-image: var(--mascara-cerrados); mask-image: var(--mascara-cerrados); transform: translate(var(--c-dx, 0), var(--c-dy, 0)); }
  #r-medio, #r-cerrados { transition-duration: .035s; }
  #escena.dormido #r-cerrados { transition-duration: .35s; }
  #escena.parpadeo-medio #r-medio { opacity: 1; }
  #r-cerrados { -webkit-mask-image: var(--mascara-cerrados); mask-image: var(--mascara-cerrados); transform: translate(var(--c-dx, 0), var(--c-dy, 0)); }
  #r-contento { -webkit-mask-image: var(--mascara-contento); mask-image: var(--mascara-contento); transform: translate(var(--f-dx, 0), var(--f-dy, 0)); transition-duration: .2s; }
  /* La IA a veces redibuja la cabeza girada: entonces no se mezcla media cara de cada imagen, se cambia entera con un fundido. */
  .retrato .variante.entera { -webkit-mask-image: none; mask-image: none; transform: none; transition-duration: .12s; }
  #escena.parpadeo .retrato:has(#r-cerrados.entera) #r-base, #escena.dormido .retrato:has(#r-cerrados.entera) #r-base,
  #escena.feliz .retrato:has(#r-contento.entera) #r-base, #escena.sorpresa .retrato:has(#r-contento.entera) #r-base { opacity: 0; transition: opacity .12s linear; }
  #r-base { transition: opacity .12s linear; }
  #escena.parpadeo #r-cerrados, #escena.dormido #r-cerrados { opacity: 1; }
  #escena.feliz #r-contento, #escena.sorpresa #r-contento { opacity: 1; }
  #escena.dormido .mueve { animation-duration: 8s; }
  #escena.habla .salto { animation: salta .42s ease-in-out 2; }
  #escena.sorpresa .salto { animation: sorpresa .7s cubic-bezier(.3, 1.6, .5, 1); }
  #escena.feliz .salto { animation: salta .5s ease-in-out 3; }
  @keyframes salta { 50% { transform: translateY(-2.2%); } }
  @keyframes sorpresa { 30% { transform: translateY(-3%) scale(1.03); } }
  /* Oscuro: los ojos brillan un poco más al hablar o alegrarse. */
  .brillo-ojos { position: absolute; left: var(--ox); top: var(--oy); width: var(--ow); height: var(--oh); transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 190, 90, .55), transparent); mix-blend-mode: screen; opacity: .25; transition: opacity .4s; pointer-events: none; }
  #escena.habla .brillo-ojos, #escena.feliz .brillo-ojos, #escena.sorpresa .brillo-ojos { opacity: .8; }
  #escena.dormido .brillo-ojos, body:not(.e-oscuro) .brillo-ojos { opacity: 0; }

  /* Bocadillo */
  .bocadillo { position: absolute; left: 60%; top: 9%; max-width: 36%; padding: 1.6vmin 2.4vmin; border-radius: 1.4vmin;
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500; font-size: 3.7vmin; line-height: 1.22; color: #f1e6d2;
    background: rgba(12, 10, 17, .84); border: 1px solid rgba(232, 162, 74, .55); box-shadow: 0 1vmin 4vmin rgba(0, 0, 0, .6), 0 0 3vmin rgba(232, 162, 74, .12);
    opacity: 0; transform: translateY(1vmin); transition: opacity .5s ease, transform .5s ease; }
  .bocadillo.ve { opacity: 1; transform: none; }
  .bocadillo::after { content: ""; position: absolute; left: -1.2vmin; bottom: 2vmin; width: 2vmin; height: 2vmin; transform: rotate(45deg);
    background: rgba(12, 10, 17, .84); border-left: 1px solid rgba(232, 162, 74, .55); border-bottom: 1px solid rgba(232, 162, 74, .55); }
  /* Estilos modernos: un panel de cristal oscuro con una línea del color de acento. */
  body.redondo .bocadillo { font-family: "Inter", "Segoe UI", sans-serif; font-style: normal; font-weight: 500; font-size: 3.2vmin; color: #fff;
    background: var(--b-fondo); border: 1px solid rgba(255, 255, 255, .16); border-left: .5vmin solid var(--b-borde); border-radius: .4vmin 1.4vmin 1.4vmin .4vmin; box-shadow: 0 1.5vmin 4vmin rgba(0, 0, 0, .45); }
  body.redondo .bocadillo::after { display: none; }
  body.e-alegre { --b-fondo: rgba(12, 14, 36, .78); --b-borde: #6ee7ff; }
  body.e-acogedor { --b-fondo: rgba(30, 19, 12, .8); --b-borde: #f3b37a; }
  body.e-propio { --b-fondo: color-mix(in srgb, var(--c3) 35%, rgba(8, 9, 22, .8)); --b-borde: var(--c1); }
  body.e-propio:not(.redondo) .bocadillo { border-color: color-mix(in srgb, var(--c1) 60%, transparent); }
  .zzz { position: absolute; left: 60%; top: 30%; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 600; font-size: 6vmin; color: #ffd08a; opacity: 0; }
  body.redondo .zzz { font-family: "Inter", sans-serif; font-style: normal; font-weight: 600; color: var(--b-borde); text-shadow: 0 0 2vmin var(--b-borde); }
  .zzz.ve { animation: zzz 3.4s ease-in infinite; }
  @keyframes zzz { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 30% { opacity: .9; } 100% { opacity: 0; transform: translate(6vmin, -14vmin) scale(1.3); } }
</style>
</head>
<body class="e-oscuro">
<div id="escena">
  <canvas id="particulas" width="1000" height="1000"></canvas>
  <div class="retrato" id="retrato" hidden>
    <div class="salto"><div class="gira" id="gira"><div class="mueve">
      <img id="r-base" alt="">
      <img id="r-medio" class="variante" alt="">
      <img id="r-cerrados" class="variante" alt="">
      <img id="r-contento" class="variante" alt="">
      <div class="brillo-ojos"></div>
    </div></div></div>
  </div>
  <div class="bocadillo" id="bocadillo"></div>
  <div class="zzz" id="zzz">z z</div>
</div>

<script src="/red.js"></script>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const DEMO = q.get('demo') === '1';
const SIEMPRE = q.get('siempre') === '1' || DEMO;
const MODO = q.get('bocadillo') ?? 'reacciones'; // '0' | 'reacciones' | 'todo'
if (q.get('fondo') === '1') document.body.classList.add('fondo');
const $ = (id) => document.getElementById(id);
const escena = $('escena');

// ---------------- Estilo ----------------
// Los hechos llevan sus colores en el CSS; los propios ('mi…') traen los suyos.
const HECHOS = { oscuro: 'ceniza', alegre: 'destellos', acogedor: 'ceniza' };
let estilo = 'oscuro';
let particulas = 'ceniza';
let colores = null;
let estiloPuesto = '';
function ponerEstilo(e, ap) {
  const propio = /^mi[a-z0-9]+$/.test(e || '') && ap && ap.colores;
  if (!propio && !HECHOS[e]) e = 'oscuro';
  const clave = JSON.stringify([e, propio ? ap : null]);
  if (clave === estiloPuesto) return;
  estiloPuesto = clave;
  estilo = e;
  const b = document.body;
  for (const x of Object.keys(HECHOS)) b.classList.toggle(`e-${x}`, x === e);
  b.classList.toggle('e-propio', !!propio);
  b.classList.toggle('redondo', propio ? ap.base === 'redondo' : e !== 'oscuro');
  for (const [v, k] of [['--c1', 'principal'], ['--c2', 'secundario'], ['--c3', 'cieloArriba'], ['--c4', 'cieloAbajo']]) {
    if (propio) b.style.setProperty(v, ap.colores[k]); else b.style.removeProperty(v);
  }
  particulas = propio ? ap.particulas : HECHOS[e];
  colores = propio ? ap.colores : null;
}
ponerEstilo(q.get('estilo') || 'oscuro');

// ---------------- Partículas alrededor ----------------
// Oscuro: lumbres que suben. Alegre: destellos. Acogedor: pétalos que caen.
(function particulas() {
  const cv = $('particulas');
  const lienzo = cv.getContext('2d');
  // Un lienzo que no pinta nada: para mover las partículas sin dibujarlas.
  const mudo = new Proxy(function () {}, { get: (_o, k) => (k === Symbol.toPrimitive ? undefined : () => mudo), set: () => true, apply: () => mudo });
  let cx = lienzo;
  let dibujar = false;
  let limpio = false;
  const COLORES = { destellos: ['#fff', '#6ee7ff', '#a78bfa', '#ff7eb6'], petalos: ['#f4a3a3', '#f7c59f', '#a8c98f', '#ffe0a3'], nieve: ['#fff'] };
  const ps = Array.from({ length: 16 }, () => nueva({}, true));
  function nueva(p, primera = false) {
    const c = colores && particulas !== 'nieve' ? ['#fff', colores.principal, colores.secundario] : COLORES[particulas] ?? ['#ffb35c'];
    const cae = particulas === 'petalos' || particulas === 'nieve';
    return Object.assign(p, { x: 150 + Math.random() * 700, y: primera ? Math.random() * 1000 : cae ? -20 : 1000 + Math.random() * 100,
      v: .5 + Math.random() * 1.1, r: 1.5 + Math.random() * 3, f: Math.random() * 6.3, vida: 0, c: c[Math.floor(Math.random() * c.length)] });
  }
  function estrella(x, y, r) {
    cx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, d = i % 2 ? r * .28 : r; cx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); }
    cx.closePath();
  }
  (function paso() {
    requestAnimationFrame(paso);
    // Apagado (transparente): no se dibuja nada. Encendido: a 30 por segundo.
    if (escena.classList.contains('fuera')) {
      if (!limpio) { lienzo.clearRect(0, 0, 1000, 1000); limpio = true; }
      return;
    }
    limpio = false;
    // En el fotograma que no se dibuja se mueven igual: misma velocidad, la mitad de dibujo.
    dibujar = !dibujar;
    cx = dibujar ? lienzo : mudo;
    if (dibujar) lienzo.clearRect(0, 0, 1000, 1000);
    for (const p of ps) {
      p.f += .03;
      if (particulas === 'lluvia' || particulas === 'ninguna') continue;
      if (particulas === 'destellos') {
        p.vida += .008; p.y -= p.v * .3;
        if (p.vida >= 1) { nueva(p, true); p.vida = 0; }
        cx.globalAlpha = Math.sin(p.vida * Math.PI);
        cx.fillStyle = p.c; cx.shadowColor = p.c; cx.shadowBlur = 12;
        estrella(p.x, p.y, p.r * 4); cx.fill();
      } else if (particulas === 'petalos' || particulas === 'nieve') {
        p.y += p.v * .8; p.x += Math.sin(p.f) * .8;
        if (p.y > 1020) nueva(p);
        cx.globalAlpha = .85; cx.fillStyle = p.c; cx.shadowBlur = 0;
        if (particulas === 'nieve') { cx.beginPath(); cx.arc(p.x, p.y, p.r * 1.3, 0, 6.29); cx.fill(); continue; }
        cx.beginPath(); cx.ellipse(p.x, p.y, p.r * 2.4, p.r * 1.3, p.f, 0, 6.29); cx.fill();
      } else {
        p.y -= p.v; p.x += Math.sin(p.f) * .6;
        if (p.y < 250) nueva(p);
        cx.globalAlpha = Math.max(0, Math.min(1, (1000 - p.y) / 200) * Math.min(1, (p.y - 250) / 250) * .8);
        cx.fillStyle = '#ffb35c'; cx.shadowColor = '#ffb35c'; cx.shadowBlur = 10;
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.29); cx.fill();
      }
    }
    cx.globalAlpha = 1;
    cx = lienzo;
  })();
})();

// ---------------- Gestos ----------------
function mirar(x, giro = 0) {
  $('gira').style.transform = `translateX(${x * .08}%) rotate(${giro * .25}deg)`;
}
let gestoHasta = 0;
function gesto(clase, ms) {
  escena.classList.remove('feliz', 'sorpresa', 'habla');
  void escena.offsetWidth;
  escena.classList.add(clase);
  gestoHasta = Date.now() + ms;
  setTimeout(() => { if (Date.now() >= gestoHasta) escena.classList.remove(clase); }, ms);
}
let fijo = '';
let decirHasta = 0;
function decir(texto, ms = 4500) {
  if (MODO === '0') return;
  const b = $('bocadillo');
  b.textContent = texto;
  b.classList.add('ve');
  decirHasta = Date.now() + ms;
  setTimeout(() => { if (Date.now() >= decirHasta) volverAlFijo(); }, ms);
}
function volverAlFijo() {
  const b = $('bocadillo');
  if (MODO === 'todo' && fijo) { b.textContent = fijo; b.classList.add('ve'); } else b.classList.remove('ve');
}
// Por su cuenta: se inclina a un lado y a otro de vez en cuando.
setInterval(() => {
  if (escena.classList.contains('dormido') || Date.now() < gestoHasta) return;
  const x = [-14, 12, 0, 6][Math.floor(Math.random() * 4)];
  mirar(x, x / 5);
  setTimeout(() => mirar(0, 0), 2000);
}, 6500);

// ---------------- Reacciones ----------------
let ultimaActividad = Date.now();
function despertar() {
  ultimaActividad = Date.now();
  escena.classList.remove('dormido');
  $('zzz').classList.remove('ve');
}
setInterval(() => {
  const dormido = Date.now() - ultimaActividad > 90_000;
  escena.classList.toggle('dormido', dormido);
  $('zzz').classList.toggle('ve', dormido);
}, 2000);

function alChat(m) {
  despertar();
  mirar(16, 5);
  gesto('habla', 1600);
  setTimeout(() => mirar(0, 0), 2400);
  if (!m.canal && MODO !== '0' && Math.random() < .4) decir(`Te leo, ${m.nombre}`);
}
function alBotin(b) {
  despertar();
  if (b.rareza === 'legendario') { gesto('sorpresa', 3200); decir(`¡Un legendario, ${b.quien}!`); }
  else if (b.maldito) { gesto('sorpresa', 2400); decir(`Uy… eso está maldito, ${b.quien}`); }
  else { gesto('feliz', 2600); decir(`¡Bien, ${b.quien}!`); }
}

// ---------------- El personaje ----------------
const N = 160;
function pixeles(img) {
  const cv = document.createElement('canvas');
  cv.width = N; cv.height = N;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  try { cx.drawImage(img, 0, 0, N, N); return cx.getImageData(0, 0, N, N).data; } catch { return null; }
}
const percentil = (xs, p) => xs[Math.min(xs.length - 1, Math.floor(xs.length * p))];

/**
 * Cuánto se ha movido el personaje de una imagen a otra: la IA, al redibujar
 * los ojos cerrados o la sonrisa, a veces baja o desplaza un poco la cabeza.
 * Se prueba cada desplazamiento pequeño y se queda el que menos diferencia deja.
 */
function alinear(a, b) {
  let mejor = { dx: 0, dy: 0, error: Infinity };
  for (let dy = -12; dy <= 12; dy += 2) for (let dx = -12; dx <= 12; dx += 2) {
    let suma = 0, n = 0;
    for (let y = 16; y < N - 16; y += 3) for (let x = 16; x < N - 16; x += 3) {
      const i = (y * N + x) * 4, j = ((y + dy) * N + (x + dx)) * 4;
      if (a[i + 3] < 120 || b[j + 3] < 120) continue;
      suma += Math.abs(a[i] - b[j]) + Math.abs(a[i + 1] - b[j + 1]) + Math.abs(a[i + 2] - b[j + 2]);
      n++;
    }
    const error = n ? suma / n : Infinity;
    if (error < mejor.error) mejor = { dx, dy, error };
  }
  return mejor;
}

/**
 * Dónde cambia de verdad una variante (los ojos al parpadear; ojos y boca al
 * alegrarse): ya alineada, la ventana de `ancho`×`alto` con más píxeles
 * distintos en la zona de la cara. Si lo distinto está repartido por todo el
 * personaje (la cabeza cambió de ángulo), devuelve null: no hay trozo que
 * encaje y la variante tendrá que ir entera.
 */
function zonaQueCambia(a, b, ancho = .34, alto = .14) {
  if (!a || !b) return null;
  const { dx, dy } = alinear(a, b);
  const d = new Uint8Array(N * N);
  let total = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const xb = x + dx, yb = y + dy;
    if (xb < 0 || yb < 0 || xb >= N || yb >= N) continue;
    const i = (y * N + x) * 4, j = (yb * N + xb) * 4;
    if (a[i + 3] < 120 || b[j + 3] < 120) continue;
    if (Math.abs(a[i] - b[j]) + Math.abs(a[i + 1] - b[j + 1]) + Math.abs(a[i + 2] - b[j + 2]) > 110) { d[y * N + x] = 1; total++; }
  }
  if (total < 6) return null;
  // Suma por ventanas con una tabla acumulada: rápido aunque se prueben todas.
  const W = N + 1, S = new Uint32Array(W * W);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) S[(y + 1) * W + x + 1] = d[y * N + x] + S[y * W + x + 1] + S[(y + 1) * W + x] - S[y * W + x];
  const w = Math.round(ancho * N), h = Math.round(alto * N);
  let mejor = { c: -1, x: 0, y: 0 };
  for (let y = Math.round(N * .08); y + h <= Math.round(N * .8); y++) for (let x = Math.round(N * .1); x + w <= Math.round(N * .9); x++) {
    const c = S[(y + h) * W + x + w] - S[y * W + x + w] - S[(y + h) * W + x] + S[y * W + x];
    if (c > mejor.c) mejor = { c, x, y };
  }
  // Si en la ventana está menos de un tercio de lo que cambia, no es «los ojos»: es la cabeza entera.
  if (mejor.c < 6 || mejor.c / total < .33) return null;
  return { x: (mejor.x + w / 2) / N, y: (mejor.y + h / 2) / N, w: ancho, h: alto, dx: dx / N, dy: dy / N };
}

/** Si no se puede comparar: los píxeles ámbar muy brillantes de arriba (los ojos del errante). */
function ojosBrillantes(a) {
  if (!a) return null;
  const pts = [];
  for (let y = 0; y < N * .55; y++) for (let x = 0; x < N; x++) {
    const i = (y * N + x) * 4;
    if (a[i + 3] > 200 && a[i] > 225 && a[i + 1] > 150 && a[i + 2] < 150 && a[i] - a[i + 2] > 110) pts.push([x, y]);
  }
  if (pts.length < 4) return null;
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  return { x: (x0 + x1) / 2 / N, y: (y0 + y1) / 2 / N, w: Math.max((x1 - x0) / N, .1), h: Math.max((y1 - y0) / N, .03) };
}

const elipse = (o, margen = .06) =>
  `radial-gradient(ellipse ${(o.w * .5 + margen) * 100}% ${(o.h * .5 + margen) * 100}% at ${o.x * 100}% ${o.y * 100}%, #000 60%, transparent 100%)`;

let retratoPuesto = null;
let retratoCargando = null;
let cargaRetrato = 0;
let tieneMedio = false;
let zonasGuardadas = null;
function cargar(img, src) {
  return new Promise((ok) => { img.onload = () => ok(true); img.onerror = () => ok(false); img.crossOrigin = 'anonymous'; img.src = src; });
}
async function ponerRetrato(ruta, zonas = null, version = '') {
  if (!/^imagenes\/avatar\/[\w.-]+$/.test(ruta || '')) ruta = 'imagenes/avatar/errante';
  const clave = JSON.stringify([ruta, zonas, version]);
  if (clave === retratoPuesto || clave === retratoCargando) return;
  const carga = ++cargaRetrato;
  retratoCargando = clave;
  // 27 sep 2026: publicar un conjunto completo; nunca dejar media cara cargada.
  const anteriores = ['r-base', 'r-medio', 'r-cerrados', 'r-contento'].map($);
  const nuevas = anteriores.map((anterior) => { const img = new Image(); img.id = anterior.id; img.className = anterior.className; return img; });
  const [base, medio, cerrados, contento] = nuevas;
  const url = (v) => `../${ruta}/${v}.png?v=${encodeURIComponent(version)}`;
  try {
    const cargas = await Promise.all(['base', 'medio', 'cerrados', 'contento'].map((v, i) => cargar(nuevas[i], url(v))));
    if (carga !== cargaRetrato) return;
    if (!cargas[0]) throw new Error('No se pudo cargar la base del personaje');
    for (let i = 1; i < nuevas.length; i++) if (!cargas[i]) {
      if (!await cargar(nuevas[i], url('base'))) throw new Error('No se pudo cargar la reserva del personaje');
    }
    if (carga !== cargaRetrato) return;
    tieneMedio = cargas[1];
  const [pb, pc, pf] = [pixeles(base), pixeles(cerrados), pixeles(contento)];
  const r = $('retrato');
  /**
   * Cada variante: si su cambio está en un trozo (los ojos; ojos y boca), se
   * mueve lo que se movió la cabeza y solo se ve ese trozo. Si no, entera.
   * La máscara va en las coordenadas de la propia variante (se mueve con ella).
   */
  const colocar = (img, z, pre) => {
    img.classList.toggle('entera', !z);
    if (!z) return;
    r.style.setProperty(`--${pre}-dx`, `${-z.dx * 100}%`);
    r.style.setProperty(`--${pre}-dy`, `${-z.dy * 100}%`);
    r.style.setProperty(pre === 'c' ? '--mascara-cerrados' : '--mascara-contento', elipse({ ...z, x: z.x + z.dx, y: z.y + z.dy }, .03));
  };
  // Hecho con máscara (avatar-ia.ts): solo cambió esa zona, y se sabe cuál. Si
  // no, se busca comparando, y si no encaja, la variante va entera.
  const valida = (z) => z && ['x', 'y', 'w', 'h'].every((k) => typeof z[k] === 'number' && z[k] >= 0 && z[k] <= 1);
  const ojos = valida(zonas?.ojos) ? { ...zonas.ojos, dx: 0, dy: 0 } : zonaQueCambia(pb, pc);
  colocar(cerrados, ojos, 'c');
  medio.classList.toggle('entera', !ojos); // misma zona y mismo sitio que los cerrados
  // Alegrarse, sin zona guardada, cambia más que los ojos (boca, hombros, brillos): entera, con un fundido.
  colocar(contento, valida(zonas?.cara) ? { ...zonas.cara, dx: 0, dy: 0 } : null, 'f');
  // El brillo de los ojos (solo en el estilo oscuro): donde estén, o donde brillan en el errante.
  const brillo = ojos ?? ojosBrillantes(pb) ?? { x: .5, y: .3, w: .22, h: .06 };
  r.style.setProperty('--ox', `${brillo.x * 100}%`); r.style.setProperty('--oy', `${brillo.y * 100}%`);
  r.style.setProperty('--ow', `${(brillo.w + .06) * 100}%`); r.style.setProperty('--oh', `${(brillo.h + .06) * 100}%`);
  nuevas.forEach((img, i) => anteriores[i].replaceWith(img));
  retratoPuesto = clave;
  zonasGuardadas = zonas;
  r.hidden = false;
  } catch (error) { console.warn('Avatar: se conserva el retrato anterior', error); }
  finally { if (carga === cargaRetrato) retratoCargando = null; }
}

// Parpadea solo, cada pocos segundos.
(function parpadear() {
  setTimeout(() => {
    if (!escena.classList.contains('feliz') && !escena.classList.contains('sorpresa')) {
      if (tieneMedio) {
        // abierto → medio → cerrado → medio → abierto
        const paso = (ms, fn) => setTimeout(fn, ms);
        escena.classList.add('parpadeo-medio');
        paso(45, () => { escena.classList.add('parpadeo'); escena.classList.remove('parpadeo-medio'); });
        paso(135, () => { escena.classList.add('parpadeo-medio'); escena.classList.remove('parpadeo'); });
        paso(185, () => escena.classList.remove('parpadeo-medio'));
      } else {
        escena.classList.add('parpadeo');
        setTimeout(() => escena.classList.remove('parpadeo'), 140);
      }
    }
    parpadear();
  }, 4500 + Math.random() * 4500);
})();

// ---------------- Datos ----------------
const vistosChat = new Set();
const vistosBotin = new Set();
let primera = true;
function pintar(d) {
  const visible = SIEMPRE || d.config.avatar;
  ponerEstilo(q.get('estilo') || d.config.estilo, q.get('estilo') ? null : d.config.apariencia);
  ponerRetrato(q.get('imagen') ?? d.config.avatarImagen ?? '', q.get('imagen') ? null : d.config.avatarZonas ?? null, d.config.avatarVersion ?? '');
  escena.classList.toggle('fuera', !visible);
  fijo = d.config.avatarTexto || '';
  if (Date.now() >= decirHasta) volverAlFijo();
  for (const m of d.chat) {
    if (vistosChat.has(m.n)) continue;
    vistosChat.add(m.n);
    if (!primera && visible) alChat(m);
  }
  for (const b of [...d.botin].reverse()) {
    if (vistosBotin.has(b.id)) continue;
    vistosBotin.add(b.id);
    if (!primera && visible) alBotin(b);
  }
  primera = false;
}
