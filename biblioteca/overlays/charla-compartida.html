<!doctype html>
<!-- Overlay transparente para la escena «Charla + compartir» de OBS.
     OBS coloca la webcam y la captura debajo; ?demo=1 enseña una maqueta. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Charla + compartir</title>
<style>
  :root { --oro: #e9c891; --blanco: #f7f2e9; --borde: rgba(233, 200, 145, .68); }
  * { box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: transparent; }
  body { color: var(--blanco); font-family: Inter, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  .demo-camara { display: none; position: absolute; inset: 0; background: radial-gradient(ellipse at 34% 35%, #725d63 0%, #27202e 40%, #09090e 88%); }
  .demo-camara::before { content: ''; position: absolute; left: 390px; top: 210px; width: 305px; height: 365px; border-radius: 48% 48% 44% 44%; background: linear-gradient(120deg, #5c5261, #302a38 52%, #17141d); box-shadow: 0 0 85px rgba(185, 157, 153, .16); }
  .demo-camara::after { content: ''; position: absolute; left: 145px; top: 555px; width: 820px; height: 630px; border-radius: 50% 50% 0 0; background: linear-gradient(125deg, #302a36, #514657 43%, #17141d); opacity: .9; }
  .demo-muestra { display: none; position: absolute; left: 1010px; top: 150px; width: 850px; height: 478px; overflow: hidden; border-radius: 15px; background: #d7dce4; opacity: var(--opacidad-compartida, 1); color: #242d42; font: 18px 'Segoe UI', sans-serif; }
  .demo-muestra .barra { height: 48px; padding: 11px 19px; background: #f3f5f8; font-size: 18px; }
  .demo-muestra .barra::before { content: '● ● ●'; color: #b5beca; margin-right: 21px; letter-spacing: 4px; }
  .demo-muestra .contenido { display: flex; gap: 24px; padding: 36px; }
  .demo-muestra .miniatura { width: 260px; height: 260px; border-radius: 12px; background: linear-gradient(130deg, #78739c, #b99197 55%, #3e4862); }
  .demo-muestra .lineas { flex: 1; padding-top: 10px; }
  .demo-muestra .lineas b { display: block; margin-bottom: 26px; font-size: 31px; }
  .demo-muestra .lineas i { display: block; height: 15px; margin: 17px 0; border-radius: 5px; background: #aeb8c6; }
  .demo-muestra .lineas i:nth-child(3) { width: 72%; } .demo-muestra .lineas i:nth-child(4) { width: 88%; }
  body.demo .demo-camara, body.demo .demo-muestra { display: block; }
  .tono { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(5, 6, 11, .3), transparent 60%), linear-gradient(0deg, rgba(4, 5, 10, .66), transparent 33%); }
  .cabecera { position: absolute; left: 64px; top: 55px; display: flex; align-items: center; gap: 18px; text-shadow: 0 2px 15px #000; }
  .marca { width: 11px; height: 11px; border-radius: 50%; background: #e65f5a; box-shadow: 0 0 18px #e65f5a; }
  .cabecera strong { font-size: 20px; letter-spacing: .28em; text-transform: uppercase; font-weight: 700; }
  .cabecera span { padding-left: 17px; border-left: 1px solid rgba(255,255,255,.55); color: var(--oro); font-size: 15px; letter-spacing: .24em; text-transform: uppercase; }
  .muestra-marco { position: absolute; left: 1010px; top: 150px; width: 850px; height: 478px; border: 1px solid var(--borde); border-radius: 15px; box-shadow: 0 0 0 9px rgba(8, 10, 18, .48), 0 26px 80px rgba(0,0,0,.38); pointer-events: none; }
  .muestra-marco::before { content: ''; position: absolute; left: 23px; right: 23px; top: -10px; height: 2px; background: linear-gradient(90deg, transparent, var(--oro), transparent); }
  .muestra-etiqueta { position: absolute; left: 1010px; top: 652px; display: flex; gap: 14px; align-items: center; color: var(--oro); font-size: 15px; letter-spacing: .28em; font-weight: 700; text-transform: uppercase; text-shadow: 0 2px 10px #000; }
  .muestra-etiqueta::before { content: ''; width: 29px; height: 1px; background: var(--oro); }
  .pie { position: absolute; left: 64px; right: 64px; bottom: 57px; display: flex; align-items: end; justify-content: space-between; gap: 48px; text-shadow: 0 3px 22px #000; }
  .pie .texto { max-width: 930px; min-width: 0; }
  .pie .kicker { color: var(--oro); font-size: 15px; letter-spacing: .3em; font-weight: 700; text-transform: uppercase; }
  .pie h1 { margin: 10px 0 0; font-family: Georgia, serif; font-size: 69px; font-weight: 400; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pie .tema { margin-top: 13px; font-size: 23px; color: #eee5d7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: no-preference) { .marca { animation: pulso 2.2s ease-in-out infinite; } @keyframes pulso { 50% { opacity: .5; box-shadow: 0 0 8px #e65f5a; } } }
</style>
</head>
<body>
  <div class="demo-camara"></div>
  <div class="demo-muestra"><div class="barra">Contenido compartido</div><div class="contenido"><div class="miniatura"></div><div class="lineas"><b>Lo estamos viendo juntos</b><i></i><i></i><i></i></div></div></div>
  <div class="tono"></div>
  <header class="cabecera"><i class="marca"></i><strong id="canal">Crid4m</strong><span>Charla en directo</span></header>
  <div class="muestra-marco"></div>
  <div class="muestra-etiqueta">En pantalla</div>
  <footer class="pie"><div class="texto"><div class="kicker">Hablemos de esto</div><h1 id="rotulo">Just Chatting</h1><div class="tema" id="tema"></div></div></footer>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('demo') === '1') document.body.classList.add('demo');
  const opacidad = Number(q.get('opacidad'));
  if (Number.isFinite(opacidad) && opacidad >= .65 && opacidad <= 1) document.documentElement.style.setProperty('--opacidad-compartida', opacidad);
  async function actualizar() {
    if (document.body.classList.contains('demo')) return;
    try {
      const r = await fetch('/api/overlay/escena?tipo=charla', { cache: 'no-store' });
      if (!r.ok) return;
      const d = await r.json();
      document.getElementById('canal').textContent = d.canal || 'Crid4m';
      document.getElementById('rotulo').textContent = d.config?.charla || 'Just Chatting';
      document.getElementById('tema').textContent = d.tema?.titulo || '';
    } catch { /* La escena sigue visible si el bot se reinicia. */ }
  }
  actualizar();
  setInterval(actualizar, 5000);
</script>
</body>
</html>
