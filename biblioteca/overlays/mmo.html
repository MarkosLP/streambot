<!doctype html>
<!-- Escena viva de El Linde del Velo. Lee GET /api/mmo/estado del bot.
     El motor decide progreso y premios; esta página solo los muestra. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>El Linde del Velo</title>
<style>
  @font-face { font-family: 'Cinzel Decorative Local'; src: url('../imagenes/combate/fuentes/CinzelDecorative-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Rajdhani Local'; src: url('../imagenes/combate/fuentes/Rajdhani-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Rajdhani Local'; src: url('../imagenes/combate/fuentes/Rajdhani-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
  :root {
    --oro: #e9c891; --oro-claro: #fff1cc; --oro-viejo: #a9824a; --tinta: #f6efe2; --suave: #cdbfa6;
    --acento: #f0a24a; --acento-b: 240, 162, 74;   /* lo cambia cada región */
    --placa: linear-gradient(180deg, rgba(18, 14, 24, .9), rgba(8, 7, 12, .86));
  }
  * { box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #07060a; }
  body { font-family: 'Rajdhani Local', 'Segoe UI', sans-serif; color: var(--tinta); }
  body[data-region="bosque"] { --acento: #f0a24a; --acento-b: 240, 162, 74; }
  body[data-region="cantera"] { --acento: #b48cff; --acento-b: 180, 140, 255; }
  body[data-region="marisma"] { --acento: #5fe0c8; --acento-b: 95, 224, 200; }

  /* Fondo pintado por lugar; al cambiar, funde. */
  .fondo { position: absolute; inset: 0; background: center / cover no-repeat; transition: opacity 1.2s ease, filter 1.2s ease; }
  .fondo.atenuado { filter: saturate(.35) brightness(.45) blur(3px); }
  .velo { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(6, 5, 9, .78), transparent 22%, transparent 70%, rgba(6, 5, 9, .9)),
                linear-gradient(270deg, rgba(6, 5, 9, .72), transparent 34%); }

  .placa { background: var(--placa); border: 1.5px solid var(--oro-viejo); border-radius: 12px;
    box-shadow: 0 0 0 1px #000, 0 10px 30px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 230, 170, .2); }

  /* Arriba: el mundo, el lugar y el estado. */
  .cabecera { position: absolute; left: 64px; top: 44px; }
  .mundo { font-family: 'Cinzel Decorative Local', Georgia, serif; font-size: 56px; line-height: 1; letter-spacing: .02em;
    background: linear-gradient(180deg, var(--oro-claro), var(--oro) 55%, #b98b47); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #000) drop-shadow(0 0 18px rgba(0, 0, 0, .8)); }
  .lugar { margin-top: 10px; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; text-shadow: 0 2px 6px #000; }
  .lugar::before { content: ''; width: 34px; height: 2px; background: var(--acento); box-shadow: 0 0 10px var(--acento); }
  .estado { margin-left: 6px; padding: 4px 16px; border-radius: 999px; font-size: 22px; letter-spacing: .08em; text-transform: uppercase;
    background: rgba(var(--acento-b), .18); border: 1.5px solid rgba(var(--acento-b), .8); color: var(--oro-claro); }

  .ausente { position: absolute; right: 64px; top: 52px; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 14px; font-size: 24px; font-weight: 700; }
  .ausente img { width: 46px; height: 46px; object-fit: contain; filter: drop-shadow(0 2px 4px #000); }
  .ausente small { display: block; font-size: 18px; font-weight: 600; color: var(--suave); letter-spacing: .04em; }

  /* Lateral: el objetivo común. */
  .lateral { position: absolute; right: 64px; top: 190px; width: 420px; padding: 26px 28px 24px; }
  .lateral h2 { margin: 0; font-size: 20px; letter-spacing: .3em; text-transform: uppercase; color: var(--oro); }
  .meta { margin: 6px 0 2px; font-size: 32px; font-weight: 700; line-height: 1.1; }
  .cuenta { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; }
  .cuenta b { font-size: 72px; line-height: .9; color: var(--oro-claro); text-shadow: 0 3px 0 #000, 0 0 18px rgba(var(--acento-b), .5); }
  .cuenta span { font-size: 34px; color: var(--suave); }
  .barra { position: relative; display: flex; gap: 6px; height: 22px; margin: 16px 0 12px; }
  .barra i { flex: 1; border-radius: 4px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 230, 170, .18); }
  .barra i.lleno { background: linear-gradient(180deg, #fff3d6, var(--acento)); border-color: var(--acento); box-shadow: 0 0 12px rgba(var(--acento-b), .75); }
  .reloj { font-size: 26px; font-weight: 600; color: var(--suave); }
  .reloj b { color: var(--tinta); font-variant-numeric: tabular-nums; }
  .compania { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255, 230, 170, .18); }
  .compania h3 { margin: 0 0 10px; font-size: 18px; letter-spacing: .28em; text-transform: uppercase; color: var(--oro); }
  .compania ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .compania li { display: flex; justify-content: space-between; gap: 12px; font-size: 27px; font-weight: 700; }
  .compania li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .compania li em { font-style: normal; color: var(--acento); letter-spacing: .1em; }
  .compania .vacia { font-size: 22px; font-weight: 600; color: var(--suave); }

  /* Centro: lo que pasa ahora (calma, resultado, desconexión). */
  .centro { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 900px; text-align: center; }
  .centro[hidden] { display: none; }
  .aviso { padding: 34px 48px 36px; }
  .aviso .sello { font-size: 20px; letter-spacing: .4em; text-transform: uppercase; color: var(--acento); }
  .aviso h1 { margin: 10px 0 8px; font-family: 'Cinzel Decorative Local', Georgia, serif; font-size: 54px; line-height: 1.05; color: var(--oro-claro); text-shadow: 0 3px 0 #000; }
  .aviso p { margin: 0; font-size: 30px; font-weight: 600; color: var(--tinta); }
  .aviso .premio { margin-top: 18px; display: inline-block; padding: 8px 22px; border-radius: 999px; font-size: 28px; font-weight: 700;
    background: rgba(var(--acento-b), .16); border: 1.5px solid var(--acento); color: var(--oro-claro); }
  .calma .aviso { background: linear-gradient(180deg, rgba(18, 14, 24, .72), rgba(8, 7, 12, .64)); }
  .gira { display: inline-block; width: 46px; height: 46px; margin-bottom: 10px; border-radius: 50%; border: 4px solid rgba(255, 230, 170, .2); border-top-color: var(--oro);
    animation: gira 1.1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* Abajo: últimas acciones y los tres comandos. */
  .pie { position: absolute; left: 64px; right: 64px; bottom: 44px; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .acciones { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; max-width: 980px; }
  .acciones li { font-size: 28px; font-weight: 600; text-shadow: 0 2px 6px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acciones li:nth-child(1) { opacity: 1; } .acciones li:nth-child(2) { opacity: .78; } .acciones li:nth-child(3) { opacity: .55; }
  .acciones b { color: var(--oro-claro); }
  .comandos { display: flex; gap: 14px; flex: none; }
  .comandos span { padding: 12px 22px; font-size: 32px; font-weight: 700; letter-spacing: .02em; color: var(--oro-claro); }
  .comandos span.principal { border-color: var(--acento); box-shadow: 0 0 0 1px #000, 0 0 22px rgba(var(--acento-b), .55), inset 0 1px 0 rgba(255, 230, 170, .2); }

  body.sin-datos .lateral, body.sin-datos .acciones, body.sin-datos .comandos { opacity: .35; filter: grayscale(.6); }

</style>
</head>
<body data-region="bosque">
<div class="fondo" id="fondo"></div>
<div class="velo"></div>

<header class="cabecera">
  <div class="mundo">El Linde del Velo</div>
  <div class="lugar"><span id="lugar"></span><span class="estado" id="estado"></span></div>
</header>

<div class="ausente placa"><img src="../imagenes/espectadores/icono.png" alt=""><div>Crid4m está ausente<small>El mundo sigue: jugad vosotros</small></div></div>

<aside class="lateral placa" id="lateral">
  <h2>Objetivo de la compañía</h2>
  <div class="meta" id="meta"></div>
  <div class="cuenta"><b id="actual"></b><span id="total"></span></div>
  <div class="barra" id="barra"></div>
  <div class="reloj" id="reloj"></div>
  <div class="compania"><h3>La compañía</h3><ol id="compania"></ol></div>
</aside>

<section class="centro" id="centro" hidden><div class="aviso placa" id="aviso"></div></section>

<footer class="pie">
  <ul class="acciones" id="acciones"></ul>
  <div class="comandos"><span class="placa principal">!explorar</span><span class="placa">!mundo</span><span class="placa">!expedicion</span></div>
</footer>

<script>
  // La maqueta de Claude queda en mmo-prototipo.html. Esta copia lee el motor.
  const REGIONES = {
    bosque: { nombre: 'Fronda Ámbar', meta: 'Abrir camino entre las raíces', hallazgo: 'un altar de savia antigua' },
    cantera: { nombre: 'Canteras del Eco', meta: 'Despertar a los colosos de piedra', hallazgo: 'el rostro de un rey olvidado' },
    marisma: { nombre: 'Marisma de los Faroles', meta: 'Encender los faroles hundidos', hallazgo: 'un farol que todavía arde' },
  };
  const $ = (id) => document.getElementById(id);
  const texto = (etiqueta, contenido, clase) => { const el = document.createElement(etiqueta); if (clase) el.className = clase; el.textContent = contenido; return el; };
  const mmss = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const resumenNombres = (nombres) => nombres.length <= 3
    ? nombres.length <= 1 ? (nombres[0] || 'La compañía') : `${nombres.slice(0, -1).join(', ')} y ${nombres.at(-1)}`
    : `${nombres.slice(0, 3).join(', ')} y ${nombres.length - 3} más`;
  let ultimo = { version: 1, modo: 'apagado', fase: 'calma', region: { id: 'bosque', nombre: 'Fronda Ámbar' },
    objetivo: { actual: 0, meta: 4 }, hasta: null, participantes: [], acciones: [], resultado: null, ultimoSuceso: '' };
  let desconectado = true;

  /** Pinta un estado. Los nombres van siempre como texto, nunca como HTML. */
  function pintar(d, desconectado = false) {
    const fase = d.fase;
    const region = REGIONES[d.region.id] || REGIONES.bosque;
    document.body.dataset.region = d.region.id;
    document.body.classList.toggle('sin-datos', desconectado);
    $('fondo').style.backgroundImage = `url('../imagenes/mmo/${fase === 'calma' ? 'refugio' : (REGIONES[d.region.id] ? d.region.id : 'bosque')}.png')`;
    $('fondo').classList.toggle('atenuado', desconectado);
    $('lugar').textContent = fase === 'calma' ? 'La Última Lumbre' : region.nombre;
    $('estado').textContent = desconectado ? 'Reconectando' : d.modo === 'pausado' ? 'En pausa' : d.modo === 'apagado' ? 'Cerrado'
      : fase === 'resultado' && d.resultado?.completada === false ? 'Sin completar'
      : { calma: 'En calma', expedicion: 'Expedición', resultado: '¡Completada!' }[fase];

    $('meta').textContent = fase === 'calma' ? `Próxima salida: ${region.nombre}` : d.region.objetivo || region.meta;
    $('actual').textContent = String(d.objetivo.actual);
    $('total').textContent = `/ ${d.objetivo.meta}`;
    $('barra').replaceChildren(...Array.from({ length: d.objetivo.meta }, (_, i) => texto('i', '', i < d.objetivo.actual ? 'lleno' : '')));
    $('reloj').replaceChildren(...(d.hasta && d.modo === 'activo'
      ? [fase === 'resultado' ? 'Nueva salida en ' : 'El Velo se cierra en ', texto('b', mmss(new Date(d.hasta) - Date.now()))]
      : d.modo !== 'activo' ? ['El mundo está ', texto('b', d.modo === 'pausado' ? 'en pausa' : 'cerrado')]
      : ['Esperando a la primera persona que escriba ', texto('b', '!explorar')]));
    $('compania').replaceChildren(...(d.participantes.length
      ? d.participantes.slice(0, 5).map((p) => { const li = document.createElement('li'); li.append(texto('span', p.nombre), texto('em', '◆'.repeat(Math.min(p.aporte, 5)))); return li; })
      : [texto('li', 'Aún nadie ha salido. Basta con una persona.', 'vacia')]));
    $('acciones').replaceChildren(...(d.acciones || []).slice(0, 3).map((a) => { const li = document.createElement('li'); li.append(texto('b', a.quien), ` ${a.texto}`); return li; }));

    const aviso = $('aviso');
    $('centro').className = `centro ${fase}`;
    if (desconectado) {
      $('centro').hidden = false;
      aviso.replaceChildren(texto('span', '', 'gira'), texto('h1', 'Reconectando con el mundo'), texto('p', 'El progreso está a salvo: vuelve en cuanto el bot responda.'));
    } else if (d.modo !== 'activo') {
      $('centro').hidden = false;
      aviso.replaceChildren(texto('div', 'La Lumbre espera', 'sello'), texto('h1', d.modo === 'pausado' ? 'El mundo está en pausa' : 'El Velo está cerrado'),
        texto('p', 'Crid4m abrirá el mundo cuando llegue el momento.'));
    } else if (fase === 'calma') {
      $('centro').hidden = false;
      aviso.replaceChildren(texto('div', 'La Lumbre arde tranquila', 'sello'), texto('h1', 'Escribe !explorar'), texto('p', `y la compañía saldrá hacia ${region.nombre}.`));
    } else if (fase === 'resultado') {
      $('centro').hidden = false;
      const resultado = d.resultado;
      if (resultado?.completada) {
        const nombres = resultado.premios.map((p) => p.nombre);
        const puntos = resultado.premios.map((p) => p.renombre);
        const minimo = Math.min(...puntos);
        const maximo = Math.max(...puntos);
        const premio = puntos.length === 0 ? 'Hallazgo registrado'
          : puntos.length === 1 ? `+${puntos[0]} de renombre`
          : `+${minimo}${maximo === minimo ? '' : `–${maximo}`} de renombre por aventurero`;
        aviso.replaceChildren(texto('div', '¡Expedición completada!', 'sello'),
          texto('h1', `Hallazgo: ${resultado.hallazgo || region.hallazgo}`),
          texto('p', `${resumenNombres(nombres)} ${nombres.length === 1 ? 'lo ha conseguido' : 'lo han conseguido'}.`),
          texto('div', premio, 'premio'));
      } else {
        aviso.replaceChildren(texto('div', 'El Velo se cierra', 'sello'), texto('h1', 'La compañía vuelve a la Lumbre'),
          texto('p', `La expedición terminó con ${d.objetivo.actual}/${d.objetivo.meta}. Nadie pierde nada.`));
      }
    } else {
      $('centro').hidden = true;
    }
  }

  pintar(ultimo, true);

  async function leerEstado() {
    try {
      const respuesta = await fetch('/api/mmo/estado', { cache: 'no-store' });
      if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
      const nuevo = await respuesta.json();
      if (nuevo.version !== 1 || !nuevo.region || !nuevo.objetivo || !Array.isArray(nuevo.participantes)) throw new Error('Estado incompleto');
      ultimo = nuevo;
      desconectado = false;
      pintar(ultimo);
    } catch {
      if (!desconectado) {
        desconectado = true;
        pintar(ultimo, true);
      }
    }
  }
  leerEstado();
  setInterval(leerEstado, 3000);
  setInterval(() => {
    if (desconectado || !ultimo.hasta || ultimo.modo !== 'activo') return;
    const numero = $('reloj').querySelector('b');
    if (numero) numero.textContent = mmss(new Date(ultimo.hasta) - Date.now());
  }, 1000);
</script>
</body>
</html>
