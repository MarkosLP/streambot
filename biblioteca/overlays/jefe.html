<!doctype html>
<!--
  Overlay de combate del Loot, para OBS: el jefe de raid y los duelos.

  NO se monta a mano: lo crea "Preparar en OBS" (fuente FX Jefe). Se queda
  SIEMPRE visible: sin jefe no pinta nada, es transparente.

  Pregunta al bot cada medio segundo cómo va el combate
  (GET /api/overlay/jefe) y pinta:
    - al aparecer: aviso a pantalla completa y la barra bajando desde arriba
    - la barra de vida, con rastro del daño, marcas cada 10 % y el tiempo
    - un número por cada !atacar (los críticos, grandes y dorados)
    - al final: ¡DERROTADO! con el podio de daño, o ¡SE ESCAPA!

  Y cada !duelo: los dos luchadores, VS, una aguja que recorre la barra de
  probabilidades hasta el lado del ganador, y el resultado (7 s por duelo,
  uno detrás de otro).

  Cada jefe tiene su retrato, sus colores y su ambiente en los bordes de la
  pantalla (TEMAS, más abajo). El tipo lo manda el bot (jefe.ts, JEFES).

  ?demo=1 simula un combate entero sin bot, para verlo en la Biblioteca.
  ?demo=1&jefe=arana, con un jefe concreto (dragon, esqueleto, hidra, golem,
  liche, arana, kraken, minotauro, tanque, lag).
  ?demo=duelo, unos cuantos duelos.

  Ataque especial (especiales.ts): cartel bajo la barra, destello del color
  del jefe, y debajo quién está afectado (❄️ raftaei 12 s). Los golpes que no
  llegan salen como «❄️ ¡CONGELADO!»; lo que se cura, en verde.

  ?volumen=0.2 baja o sube el sonido (0 a 1; por defecto 0.35).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Combate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Chakra+Petch:wght@600;700&display=swap">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body {
    font-family: "Chakra Petch", "Segoe UI", sans-serif; color: #fff;
    /* Colores del jefe: claro, principal, oscuro, brillo (r, g, b) y medallón. */
    --t1: #ff7a5c; --t2: #e0212b; --t3: #8f0714; --tb: 255, 60, 30; --m1: #5a1010; --m2: #220405;
  }
  [hidden] { display: none !important; }

  /* ---------- La barra ---------- */
  .jefe {
    position: absolute; top: 34px; left: 50%; width: 1180px; height: 150px;
    transform: translateX(-50%);
    animation: baja .9s cubic-bezier(.2, 1.3, .4, 1) both;
  }
  .jefe.sale { animation: sube .6s ease-in forwards; }
  @keyframes baja { from { transform: translate(-50%, -240px); } }
  @keyframes sube { to { transform: translate(-50%, -240px); opacity: 0; } }

  .emblema {
    position: absolute; left: -20px; top: -8px; width: 170px; height: 170px; z-index: 3;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.7)) drop-shadow(0 0 22px rgba(var(--tb), .6));
  }
  .emblema.golpe { animation: sacude .28s steps(3); }
  @keyframes sacude {
    0% { transform: translate(0, 0) rotate(0); }
    33% { transform: translate(-7px, 3px) rotate(-4deg); }
    66% { transform: translate(6px, -2px) rotate(3deg); }
  }
  .emblema .ojos { animation: brillo 1.4s ease-in-out infinite; }
  @keyframes brillo { 50% { opacity: .55; } }
  .emblema .anillo { transform-origin: 100px 100px; animation: gira 16s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .insignia {
    position: absolute; left: 112px; top: 108px; width: 50px; height: 50px; z-index: 4;
    display: grid; place-items: center; font-size: 28px;
    background: radial-gradient(circle at 35% 30%, #4a2230, #14070c); border: 3px solid #d9a441; border-radius: 50%;
    box-shadow: 0 0 12px rgba(0,0,0,.8);
  }

  .cartel {
    position: absolute; left: 150px; right: 0; top: 6px; height: 50px;
    display: flex; align-items: flex-end; gap: 18px; padding-left: 26px;
  }
  .etiqueta {
    font-size: 17px; font-weight: 700; letter-spacing: .35em; color: var(--t2);
    text-shadow: 0 0 10px rgba(var(--tb), .9), 0 2px 0 #000; padding-bottom: 7px;
  }
  .nombre {
    font-family: "Cinzel", Georgia, serif; font-weight: 900; font-size: 40px; line-height: 1;
    letter-spacing: .04em; text-transform: uppercase;
    background: linear-gradient(180deg, #fff6d6 0%, #ffd36b 45%, #c9771a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.85)) drop-shadow(0 0 14px rgba(255, 170, 60, .45));
    white-space: nowrap;
  }
  .nombre.largo { font-size: 31px; }
  .reloj {
    margin-left: auto; margin-right: 8px; padding-bottom: 5px;
    font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: #fff; text-shadow: 0 2px 0 #000, 0 0 10px rgba(0,0,0,.8);
  }
  .reloj.prisa { color: #ff5a4a; animation: late .6s ease-in-out infinite; }
  @keyframes late { 50% { transform: scale(1.12); } }

  .marco {
    position: absolute; left: 150px; right: 0; top: 64px; height: 52px;
    padding: 6px; box-sizing: border-box; border-radius: 10px;
    background: linear-gradient(180deg, #5b4326, #2a1d0f 55%, #4a3520);
    box-shadow: 0 0 0 2px #0b0703, 0 0 0 4px #b98a3a, 0 0 0 6px #0b0703, 0 10px 24px rgba(0,0,0,.6);
  }
  .barra { position: relative; height: 100%; border-radius: 5px; overflow: hidden; background: #1a0707; box-shadow: inset 0 3px 8px rgba(0,0,0,.9); }
  .rastro, .vida { position: absolute; left: 0; top: 0; bottom: 0; }
  .rastro { background: linear-gradient(180deg, #fff3c4, #ffb03b); transition: width .9s ease-in .35s; }
  .vida {
    background: linear-gradient(180deg, var(--t1) 0%, var(--t2) 40%, var(--t3) 100%);
    transition: width .18s ease-out;
    box-shadow: 4px 0 12px rgba(var(--tb), .8);
  }
  .vida::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 45%, transparent 60%);
    background-size: 300% 100%; animation: brilla 2.4s linear infinite;
  }
  @keyframes brilla { from { background-position: 150% 0; } to { background-position: -150% 0; } }
  .jefe.critica .vida { animation: late-vida .7s ease-in-out infinite; }
  @keyframes late-vida { 50% { filter: brightness(1.6) saturate(1.3); } }
  .marcas { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(0,0,0,.55) calc(10% - 2px) 10%); pointer-events: none; }
  .cifra {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .06em;
    text-shadow: 0 2px 0 #000, 0 0 6px #000;
  }
  .pista {
    position: absolute; left: 176px; top: 124px; font-size: 20px; font-weight: 600; letter-spacing: .05em;
    color: rgba(255,255,255,.9); text-shadow: 0 2px 0 #000, 0 0 8px #000;
  }
  .pista b { color: #ffd36b; }

  /* ---------- Números de daño ---------- */
  .dano {
    position: absolute; z-index: 5; text-align: center; pointer-events: none; white-space: nowrap;
    font-weight: 700; font-size: 44px; color: #fff;
    text-shadow: 0 3px 0 #000, 0 0 10px rgba(0,0,0,.9);
    animation: salta 1.5s cubic-bezier(.2, .9, .4, 1) forwards;
  }
  .dano { text-shadow: 0 3px 0 #000, 0 0 14px rgba(var(--tb), .9); }
  .dano small { display: block; font-size: 18px; color: var(--t1); letter-spacing: .04em; }
  .dano.critico { font-size: 74px; color: #ffd24a; text-shadow: 0 4px 0 #6b2b00, 0 0 22px rgba(255, 170, 30, .95); animation-name: salta-critico; }
  .dano.critico::before { content: "¡CRÍTICO!"; display: block; font-size: 22px; letter-spacing: .3em; color: #fff3c4; }
  @keyframes salta {
    0% { opacity: 0; transform: translateY(10px) scale(.4); }
    15% { opacity: 1; transform: translateY(-10px) scale(1.15); }
    30% { transform: translateY(-18px) scale(1); }
    100% { opacity: 0; transform: translateY(-110px) scale(.9); }
  }
  @keyframes salta-critico {
    0% { opacity: 0; transform: scale(2.4) rotate(-8deg); }
    14% { opacity: 1; transform: scale(1) rotate(3deg); }
    22% { transform: scale(1.12) rotate(-2deg); }
    100% { opacity: 0; transform: translateY(-130px) scale(1) rotate(0); }
  }

  /* ---------- Aviso de entrada ---------- */
  .aviso {
    position: absolute; left: 0; right: 0; top: 50%; height: 190px; transform: translateY(-50%);
    display: grid; place-items: center;
    background:
      repeating-linear-gradient(-45deg, rgba(var(--tb), 0) 0 38px, rgba(var(--tb), .16) 38px 76px),
      linear-gradient(180deg, transparent, color-mix(in srgb, var(--m2) 85%, transparent) 22%, color-mix(in srgb, var(--m2) 85%, transparent) 78%, transparent);
    animation: aviso-luz 3.4s ease-in-out forwards;
  }
  @keyframes aviso-luz { 0% { opacity: 0; } 8%, 84% { opacity: 1; } 100% { opacity: 0; } }
  .aviso::before, .aviso::after { animation: aviso-linea 3.4s ease-in-out forwards; }
  @keyframes aviso-linea { 0% { transform: scaleX(0); } 12%, 84% { transform: scaleX(1); } 100% { transform: scaleX(0); opacity: 0; } }
  .aviso::before, .aviso::after { content: ""; position: absolute; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, transparent, var(--t2), transparent); box-shadow: 0 0 18px var(--t2); }
  .aviso::before { top: 30px; } .aviso::after { bottom: 30px; }
  @keyframes aviso { 0% { opacity: 0; transform: translateY(-50%) scaleY(0); } 10%, 82% { opacity: 1; transform: translateY(-50%) scaleY(1); } 100% { opacity: 0; transform: translateY(-50%) scaleY(0); } }
  .aviso-texto { text-align: center; }
  .aviso-texto span { display: block; font-size: 26px; font-weight: 700; letter-spacing: .6em; color: var(--t1); text-shadow: 0 0 14px var(--t2); animation: brillo .5s steps(2) infinite; }
  .aviso-retrato {
    width: 290px; height: 290px; margin: 0 auto -18px; display: block;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.8)) drop-shadow(0 0 40px rgba(var(--tb), .85));
    animation: retrato-entra 3.4s cubic-bezier(.2, 1.2, .3, 1) forwards;
  }
  @keyframes retrato-entra {
    0% { opacity: 0; transform: scale(2.2); }
    10% { opacity: 1; transform: scale(.94); }
    14% { transform: scale(1.03); }
    18%, 84% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(.85); }
  }
  .aviso { height: 520px; }
  .aviso-texto strong { animation: nombre-entra 3.4s ease-out forwards; }
  @keyframes nombre-entra {
    0%, 10% { opacity: 0; letter-spacing: .4em; }
    22%, 84% { opacity: 1; letter-spacing: .02em; }
    100% { opacity: 0; }
  }
  /* Al caer el retrato, un golpe de luz del color del jefe. */
  .aviso-destello {
    position: absolute; inset: -300px 0; pointer-events: none;
    background: radial-gradient(circle at 50% 42%, rgba(var(--tb), .55), transparent 40%);
    opacity: 0; animation: destello-jefe 1s ease-out .3s;
  }
  .aviso-texto strong {
    display: block; font-family: "Cinzel", Georgia, serif; font-weight: 900; font-size: 84px; line-height: 1.05; text-transform: uppercase;
    background: linear-gradient(180deg, #fff6d6, #ffcc5c 50%, #c2410c); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #000) drop-shadow(0 0 24px rgba(255, 80, 30, .7));
  }

  /* ---------- Final ---------- */
  .final {
    position: absolute; left: 50%; top: 44%; width: 1300px; transform: translate(-50%, -50%);
    text-align: center; animation: final-entra .8s cubic-bezier(.2, 1.4, .4, 1) both, final-sale .7s ease-in 8.2s forwards;
  }
  @keyframes final-entra { from { opacity: 0; transform: translate(-50%, -50%) scale(.3); } }
  @keyframes final-sale { to { opacity: 0; transform: translate(-50%, -58%) scale(1.05); } }
  .rayos {
    position: absolute; left: 50%; top: 42%; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; z-index: -1;
    background: repeating-conic-gradient(from 0deg, rgba(255, 190, 70, .26) 0deg 6deg, rgba(255, 190, 70, 0) 6deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 58%); mask-image: radial-gradient(circle, #000 0%, transparent 58%);
    animation: gira 18s linear infinite;
  }
  .final.escapa .rayos { background: radial-gradient(circle, rgba(120, 80, 170, .45), transparent 60%); animation: none; }
  .titular {
    font-family: "Cinzel", Georgia, serif; font-weight: 900; font-size: 150px; line-height: 1; text-transform: uppercase;
    background: linear-gradient(180deg, #fffbe8 0%, #ffd66b 40%, #e07a12 80%, #7a3300 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,.85)) drop-shadow(0 0 40px rgba(255, 170, 40, .7));
  }
  .final.escapa .titular { background-image: linear-gradient(180deg, #f3ecff 0%, #b9a3e0 50%, #4b2f7a 100%); filter: drop-shadow(0 6px 0 rgba(0,0,0,.85)) drop-shadow(0 0 30px rgba(140, 100, 220, .7)); }
  .final-retrato { width: 230px; height: 230px; display: block; margin: 0 auto -10px; filter: drop-shadow(0 0 30px rgba(var(--tb), .8)); }
  .final:not(.escapa) .final-retrato { animation: cae-jefe 1.6s ease-in .2s forwards; }
  @keyframes cae-jefe {
    0% { transform: none; filter: drop-shadow(0 0 30px rgba(var(--tb), .8)); }
    18% { transform: translate(-8px, 2px) rotate(-3deg); filter: brightness(2.2) drop-shadow(0 0 40px #fff); }
    30% { transform: translate(7px, -2px) rotate(2deg); }
    100% { transform: translateY(16px) rotate(-6deg) scale(.94); filter: grayscale(1) brightness(.45) drop-shadow(0 0 0 transparent); }
  }
  .final.escapa .final-retrato { animation: se-va 2.4s ease-in 1.2s forwards; }
  @keyframes se-va { to { opacity: 0; transform: translateY(-60px) scale(.7); } }
  .subtitulo { margin-top: 6px; font-size: 38px; font-weight: 700; text-shadow: 0 3px 0 #000, 0 0 14px #000; }
  .podio { display: flex; justify-content: center; gap: 22px; margin-top: 26px; }
  .puesto {
    min-width: 250px; padding: 14px 26px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(30, 20, 12, .92), rgba(12, 8, 5, .95));
    border: 3px solid var(--c); box-shadow: 0 0 26px color-mix(in srgb, var(--c) 55%, transparent);
    animation: final-entra .6s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .puesto:nth-child(1) { --c: #ffd24a; animation-delay: .5s; }
  .puesto:nth-child(2) { --c: #d7dee8; animation-delay: .7s; }
  .puesto:nth-child(3) { --c: #e0915a; animation-delay: .9s; }
  .puesto .medalla { font-size: 46px; line-height: 1; }
  .puesto .quien { font-size: 32px; font-weight: 700; color: var(--c); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .puesto .cuanto { font-size: 22px; color: rgba(255,255,255,.85); }

  /* ---------- Duelo ---------- */
  .duelo {
    position: absolute; left: 0; right: 0; top: 50%; height: 420px; transform: translateY(-50%);
    animation: duelo-sale .5s ease-in 6.6s forwards;
  }
  @keyframes duelo-sale { to { opacity: 0; transform: translateY(-50%) scale(1.03); } }
  .duelo-fondo {
    position: absolute; inset: 40px 0 20px;
    background: linear-gradient(90deg, rgba(10, 30, 70, 0), rgba(10, 30, 70, .82) 18%, rgba(8, 8, 14, .9) 50%, rgba(70, 10, 20, .82) 82%, rgba(70, 10, 20, 0));
    animation: aparece .35s ease-out both;
  }
  @keyframes aparece { from { opacity: 0; transform: scaleY(0); } }
  .luchador {
    position: absolute; top: 70px; width: 640px; text-align: center;
    animation: .55s cubic-bezier(.2, 1.3, .4, 1) both;
  }
  .luchador.izq { left: 150px; animation-name: entra-izq; }
  .luchador.der { right: 150px; animation-name: entra-der; }
  @keyframes entra-izq { from { transform: translateX(-900px); } }
  @keyframes entra-der { from { transform: translateX(900px); } }
  .luchador .quien {
    font-family: "Cinzel", Georgia, serif; font-weight: 900; font-size: 64px; line-height: 1.05;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #fff; text-shadow: 0 4px 0 #000, 0 0 22px var(--brillo);
  }
  .luchador.izq { --brillo: rgba(90, 160, 255, .8); }
  .luchador.der { --brillo: rgba(255, 90, 90, .8); }
  .luchador .titulo { font-size: 24px; font-weight: 700; color: #ffd36b; letter-spacing: .06em; min-height: 30px; text-shadow: 0 2px 0 #000; }
  .luchador .poder { margin-top: 6px; font-size: 30px; font-weight: 700; color: rgba(255,255,255,.92); text-shadow: 0 2px 0 #000; }
  .luchador .sello {
    position: absolute; left: 50%; top: -64px; transform: translateX(-50%) rotate(-6deg) scale(0);
    padding: 4px 26px; border: 4px solid #ffd24a; border-radius: 10px;
    font-family: "Cinzel", Georgia, serif; font-weight: 900; font-size: 40px; color: #ffd24a; background: rgba(40, 24, 0, .85);
    box-shadow: 0 0 30px rgba(255, 200, 60, .7); text-shadow: 0 0 12px rgba(255, 200, 60, .9);
  }
  .duelo.resuelto .luchador.gana .sello { animation: sello .45s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  @keyframes sello { to { transform: translateX(-50%) rotate(-6deg) scale(1); } }
  .duelo.resuelto .luchador.gana .quien { animation: late 0.9s ease-in-out infinite; color: #fff6d6; text-shadow: 0 4px 0 #000, 0 0 34px rgba(255, 200, 60, .95); }
  .duelo.resuelto .luchador.pierde { filter: grayscale(1) brightness(.55); transition: filter .5s; }
  .duelo.resuelto .luchador.pierde .quien { animation: tiembla-p .35s steps(3); }
  @keyframes tiembla-p { 33% { transform: translateX(-10px); } 66% { transform: translateX(8px); } }

  .vs {
    position: absolute; left: 50%; top: 58px; transform: translateX(-50%);
    font-family: "Cinzel", Georgia, serif; font-weight: 900; font-size: 130px; line-height: 1;
    background: linear-gradient(180deg, #fffbe8, #ffd24a 45%, #c2410c); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 0 #000) drop-shadow(0 0 30px rgba(255, 160, 40, .9));
    animation: vs .5s cubic-bezier(.2, 1.8, .4, 1) .45s both;
  }
  @keyframes vs { from { opacity: 0; transform: translateX(-50%) scale(3) rotate(-12deg); } }
  .destello {
    position: absolute; left: 50%; top: 120px; width: 900px; height: 900px; margin: -450px 0 0 -450px;
    background: radial-gradient(circle, rgba(255, 240, 200, .9), rgba(255, 180, 60, 0) 45%);
    opacity: 0; animation: destello .6s ease-out .5s;
  }
  @keyframes destello { 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }

  .ruleta { position: absolute; left: 50%; top: 262px; width: 900px; transform: translateX(-50%); animation: aparece .3s ease-out .8s both; }
  .ruleta-barra {
    position: relative; height: 26px; border-radius: 13px; overflow: visible;
    box-shadow: 0 0 0 3px #0b0703, 0 0 0 5px #b98a3a, 0 8px 20px rgba(0,0,0,.6);
  }
  .ruleta-a, .ruleta-b { position: absolute; top: 0; bottom: 0; }
  .ruleta-a { left: 0; border-radius: 13px 0 0 13px; background: linear-gradient(180deg, #8cc4ff, #2f6fd6); }
  .ruleta-b { right: 0; border-radius: 0 13px 13px 0; background: linear-gradient(180deg, #ff9a9a, #c0262e); }
  .ruleta-pct { display: flex; justify-content: space-between; margin-top: 8px; font-size: 24px; font-weight: 700; text-shadow: 0 2px 0 #000; }
  .ruleta-pct .a { color: #9cc9ff; } .ruleta-pct .b { color: #ff9f9f; }
  .aguja {
    position: absolute; top: -16px; bottom: -16px; width: 6px; margin-left: -3px; border-radius: 3px;
    background: #fff; box-shadow: 0 0 14px #fff, 0 0 30px rgba(255, 220, 120, .9);
    left: 50%;
  }
  .aguja::before {
    content: ""; position: absolute; left: 50%; top: -14px; transform: translateX(-50%);
    border: 10px solid transparent; border-top: 14px solid #fff;
  }
  .extra { position: absolute; left: 50%; top: 340px; transform: translateX(-50%); white-space: nowrap; text-align: center; font-size: 26px; font-weight: 700; text-shadow: 0 2px 0 #000, 0 0 10px #000; opacity: 0; }
  .duelo.resuelto .extra { animation: aparece .4s ease-out .3s forwards; }
  .extra .sorpresa { color: #ffd24a; letter-spacing: .2em; margin-right: 12px; }
  .extra .maldito { color: #a6ff7a; }

  /* ---------- Ambiente de cada jefe (bordes de la pantalla) ---------- */
  #ambiente { position: absolute; inset: 0; pointer-events: none; overflow: hidden; transition: opacity 1.1s ease; }
  #ambiente.apagando { opacity: 0; }
  .particula {
    position: absolute; top: 0; font-size: var(--tam); line-height: 1; white-space: nowrap; font-weight: 700;
    animation-timing-function: linear; animation-iteration-count: infinite;
  }
  .p-cae { top: -60px; animation-name: cae; opacity: .8; text-shadow: 0 0 8px var(--col); }
  @keyframes cae { to { transform: translate(var(--deriva), 1180px) rotate(200deg); } }
  .p-sube { top: auto; bottom: -40px; animation-name: sube-p; }
  @keyframes sube-p { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: .8; } 100% { opacity: 0; transform: translate(var(--deriva), -620px); } }
  .p-flota { top: auto; bottom: 8%; animation-name: flota; opacity: 0; text-shadow: 0 0 12px var(--col), 0 2px 0 #000; }
  @keyframes flota { 0% { opacity: 0; transform: translate(0, 0) scale(.7); } 20% { opacity: .9; } 75% { opacity: .7; } 100% { opacity: 0; transform: translate(var(--deriva), -520px) scale(1.1); } }
  .alma { width: var(--tam); height: var(--tam); border-radius: 50%; background: radial-gradient(circle, #fff 0%, var(--col) 35%, transparent 70%); filter: blur(1px); }
  .burbuja { width: var(--tam); height: var(--tam); border-radius: 50%; border: 2px solid var(--col); background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), transparent 45%); opacity: .7; }

  .miss { font-family: "Chakra Petch", sans-serif; letter-spacing: .08em; text-shadow: 0 2px 0 #000, 0 0 8px #000; animation-name: cae-texto; }
  @keyframes cae-texto { 0% { transform: translate(0, 0) rotate(-12deg); } 50% { transform: translate(calc(var(--deriva) / 2), 560px) rotate(10deg); } 100% { transform: translate(var(--deriva), 1180px) rotate(-8deg); } }
  .glitchy { font-family: Consolas, monospace; text-shadow: 2px 0 #ff00c8, -2px 0 #00e5ff; }
  .hipo { font-style: italic; }

  .escarcha { position: absolute; top: 0; width: 520px; height: 420px; }
  .escarcha.izq { left: 0; background: radial-gradient(ellipse at 0 0, rgba(230, 248, 255, .55), rgba(120, 200, 255, .18) 35%, transparent 65%); }
  .escarcha.der { right: 0; background: radial-gradient(ellipse at 100% 0, rgba(230, 248, 255, .55), rgba(120, 200, 255, .18) 35%, transparent 65%); }
  .niebla { position: absolute; left: 0; right: 0; bottom: 0; height: 220px; opacity: .75; background: linear-gradient(0deg, var(--niebla), transparent); animation: respira 5s ease-in-out infinite; }
  @keyframes respira { 50% { opacity: .45; } }

  .telarana { position: absolute; top: 0; width: 360px; height: 360px; }
  .telarana svg { width: 100%; height: 100%; }
  .telarana.izq { left: 0; }
  .telarana.der { right: 0; transform: scaleX(-1); }
  .colgada { position: absolute; top: 0; width: 46px; animation: cuelga ease-in-out infinite alternate; }
  .colgada .hilo { position: absolute; left: 22px; bottom: 30px; width: 2px; height: 1200px; background: rgba(235, 235, 245, .6); }

  @keyframes cuelga { from { transform: translateY(-80px); } to { transform: translateY(var(--baja)); } }

  .tentaculo { position: absolute; bottom: -60px; width: 150px; height: 520px; transform-origin: 50% 100%; animation: ondea 4.5s ease-in-out infinite; }
  .tentaculo svg { width: 100%; height: 100%; filter: drop-shadow(0 0 16px rgba(40, 210, 200, .5)); }
  .tentaculo.izq { left: 30px; }
  .tentaculo.der { right: 30px; animation-delay: -2.2s; }
  .tentaculo.der svg { transform: scaleX(-1); }
  @keyframes ondea { 0%, 100% { transform: rotate(-6deg) translateY(40px); } 50% { transform: rotate(7deg) translateY(0); } }

  .barrido { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0, 229, 255, .05) 0 2px, transparent 2px 5px); animation: parpadea 3s steps(6) infinite; }
  @keyframes parpadea { 50% { opacity: .4; } }
  body.glitch .jefe { filter: drop-shadow(6px 0 0 rgba(255, 0, 200, .8)) drop-shadow(-6px 0 0 rgba(0, 229, 255, .8)); transform: translate(calc(-50% + 8px), 2px) skewX(-4deg); }
  body.glitch #ambiente { transform: translateX(-10px); }

  /* El gólem hace temblar la pantalla con cada crítico. */
  body.temblor .jefe, body.temblor #danos { animation: terremoto .45s steps(6); }
  @keyframes terremoto { 20% { translate: -12px 6px; } 40% { translate: 10px -6px; } 60% { translate: -8px 4px; } 80% { translate: 6px -2px; } }

  /* Retratos: pequeños detalles vivos. */
  .emblema .vaho { animation: vaho 2s ease-out infinite; }

  .emblema .grietas { animation: brillo .9s ease-in-out infinite; }
  .emblema .runas { animation: brillo 1.8s ease-in-out infinite; }
  .emblema .estrellas { transform-origin: 100px 30px; animation: gira 3s linear infinite; }

  /* ---------- Retratos pintados (imagenes/jefes/<tipo>.png, 27 sep) ---------- */
  /* Respiran despacio; al recibir un golpe, destello blanco; con poca vida, furia roja. */
  .pintado { transform-box: fill-box; transform-origin: center; filter: brightness(1.12) contrast(1.06); animation: respira-r 4s ease-in-out infinite; }
  @keyframes respira-r { 50% { transform: scale(1.035); } }
  .emblema.golpe .pintado { animation: respira-r 4s ease-in-out infinite, fogonazo .3s ease-out; }

  .jefe.critica .emblema { filter: drop-shadow(0 6px 10px rgba(0,0,0,.7)) drop-shadow(0 0 30px rgba(255, 40, 30, .85)); }

  /* ---------- La barra al recibir golpes ---------- */
  .marco.impacto { animation: impacto-marco .22s steps(2); }
  @keyframes impacto-marco { 50% { translate: 3px 2px; } }
  .barra.impacto .vida { animation: impacto-vida .25s ease-out; }
  @keyframes impacto-vida { from { filter: brightness(2.2); } }
  /* El trozo de vida que se pierde salta y cae. */
  .esquirla {
    position: absolute; top: 6px; height: 40px; z-index: 2; pointer-events: none; border-radius: 3px;
    background: linear-gradient(180deg, #fff, var(--t1) 40%, var(--t2));
    box-shadow: 0 0 14px rgba(var(--tb), .9);
    animation: esquirla .75s cubic-bezier(.3, .2, .6, 1) forwards;

  @keyframes esquirla {
    0% { opacity: 1; transform: translate(0, 0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--dx), 70px) rotate(var(--giro)) scale(.6); }
  }

  /* ---------- Ataque especial ---------- */
  .cartel-especial {
    position: absolute; left: 50%; top: 320px; transform: translateX(-50%); z-index: 6;
    min-width: 560px; padding: 14px 40px 16px; text-align: center; border-radius: 16px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--m1) 92%, transparent), color-mix(in srgb, var(--m2) 95%, transparent));
    border: 3px solid var(--t2); box-shadow: 0 0 0 3px #000, 0 0 40px rgba(var(--tb), .75), inset 0 0 30px rgba(var(--tb), .25);
    animation: cartel-entra .5s cubic-bezier(.2, 1.6, .4, 1) both;

  .cartel-especial .icono { font-size: 54px; line-height: 1; display: block; margin-top: -44px; filter: drop-shadow(0 0 14px rgba(var(--tb), 1)); }
  .cartel-especial .aviso-ataque { display: block; margin-top: 4px; font-size: 16px; font-weight: 700; letter-spacing: .4em; color: var(--t1); opacity: .85; }
  .cartel-especial .titulo-ataque {
    display: block; font-family: "Cinzel", Georgia, serif; font-weight: 900; font-size: 50px; line-height: 1.1; text-transform: uppercase;

    filter: drop-shadow(0 3px 0 #000) drop-shadow(0 0 16px rgba(var(--tb), .8));

  .destello-jefe {

  /* Quién está afectado: debajo de la barra, donde va la pista. */
  .afectados { position: absolute; left: 176px; top: 122px; display: flex; gap: 10px; flex-wrap: wrap; }
  .afectado {

  .dano.estado { font-size: 38px; color: #e8eef8; }
  .dano.estado .icono { font-size: 44px; margin-right: 6px; }

</style>
</head>

        <g class="ojos" fill="#00e5ff"><rect x="72" y="100" width="16" height="16"/><rect x="112" y="100" width="16" height="16"/>
          <rect x="76" y="104" width="8" height="8" fill="#fff"/><rect x="116" y="104" width="8" height="8" fill="#fff"/></g>
        <path d="M76 138 H84 V132 H92 V138 H100 V132 H108 V138 H116 V132 H124" fill="none" stroke="#ff00c8" stroke-width="4"/>
        <g fill="#00e5ff"><rect x="36" y="112" width="10" height="10"/><rect x="152" y="96" width="8" height="8"/><rect x="150" y="140" width="12" height="6" fill="#ff00c8"/><rect x="40" y="146" width="8" height="8" fill="#ff00c8"/></g>
        <text x="100" y="182" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#ff2a6a">999 ms</text>`,
      ambiente: (a) => {
        lineas(a);
        particulas(a, { n: 14, texto: ['999 ms', 'PING', '⟳', 'LAG', '404'], clase: 'p-flota glitchy', color: '#00e5ff', tam: [20, 34], dur: [4, 8] });
      },
    },
  };

  /** Colores de siempre, para un jefe que el overlay no conozca. */
  const TEMA_BASE = { c: ['#ff7a5c', '#e0212b', '#8f0714', '255, 60, 30', '#5a1010', '#220405'], insignia: '👹', retrato: null, ambiente: () => {} };

  // ---------- Piezas de ambiente ----------

  const azar = (a, b) => a + Math.random() * (b - a);
  /** En los bordes: el centro de la pantalla es del juego. */
  const xBorde = () => (Math.random() < 0.5 ? azar(0, 20) : azar(80, 100));

  function particulas(capa, { n, texto, clase, color, tam, dur, todo = false }) {
    for (let i = 0; i < n; i++) {
      const p = document.createElement('span');
      p.className = `particula ${clase}`;
      p.textContent = texto ? texto[i % texto.length] : '';
      const t = azar(...tam);
      p.style.cssText = `left:${todo ? azar(0, 100) : xBorde()}%; --tam:${t}px; color:${color}; --col:${color};` +
        `animation-duration:${azar(...dur)}s; animation-delay:${-azar(0, dur[1])}s; --deriva:${azar(-60, 60)}px;`;
      capa.append(p);
    }
  }

  function escarcha(capa) {
    for (const lado of ['izq', 'der']) {
      const e = document.createElement('div');
      e.className = `escarcha ${lado}`;
      capa.append(e);
    }
  }

  function niebla(capa, color) {
    const e = document.createElement('div');
    e.className = 'niebla';
    e.style.setProperty('--niebla', color);
    capa.append(e);
  }

  const TELARANA = `<svg viewBox="0 0 200 200" fill="none" stroke="rgba(235,235,245,.55)" stroke-width="1.6">
    <path d="M0 0 L200 40 M0 0 L170 110 M0 0 L110 170 M0 0 L40 200"/>
    <path d="M34 7 Q30 22 29 29 Q20 31 7 34"/><path d="M76 15 Q66 44 62 62 Q44 67 15 76"/>
    <path d="M122 24 Q104 70 96 96 Q70 104 24 122"/><path d="M168 34 Q142 98 130 130 Q98 142 34 168"/></svg>`;

  function telaranas(capa) {
    for (const lado of ['izq', 'der']) {
      const e = document.createElement('div');
      e.className = `telarana ${lado}`;
      e.innerHTML = TELARANA;
      capa.append(e);
    }
  }

  const ARANITA = `<svg viewBox="0 0 40 40"><g stroke="#140810" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M14 16 L4 8 M14 20 L2 20 M14 24 L4 32 M16 26 L10 38 M26 16 L36 8 M26 20 L38 20 M26 24 L36 32 M24 26 L30 38"/></g>
    <ellipse cx="20" cy="24" rx="8" ry="9" fill="#1a0b12"/><circle cx="20" cy="14" r="6" fill="#1a0b12"/>
    <circle cx="18" cy="13" r="1.6" fill="#ff3b4a"/><circle cx="22" cy="13" r="1.6" fill="#ff3b4a"/>
    <path d="M20 20 L17 24 L23 24 Z M17 26 L23 26 L20 22 Z" fill="#e0112b"/></svg>`;

  function aranas(capa, n) {
    for (let i = 0; i < n; i++) {
      const e = document.createElement('div');
      e.className = 'colgada';
      e.style.left = `${i % 2 ? azar(82, 96) : azar(4, 18)}%`;
      e.style.setProperty('--baja', `${azar(160, 420)}px`);
      e.style.animationDuration = `${azar(5, 9)}s`;
      e.style.animationDelay = `${-azar(0, 6)}s`;
      e.innerHTML = `<div class="hilo"></div>${ARANITA}`;
      capa.append(e);
    }
  }

  const TENTACULO = `<svg viewBox="0 0 120 420"><path d="M60 420 C20 330 100 260 50 180 C20 130 70 70 50 20 C46 8 58 2 64 12"
    fill="none" stroke="#2a1440" stroke-width="44" stroke-linecap="round"/><path d="M60 420 C20 330 100 260 50 180 C20 130 70 70 50 20 C46 8 58 2 64 12"
    fill="none" stroke="#6a44a0" stroke-width="34" stroke-linecap="round"/>
    <g fill="#e2c4ff"><circle cx="72" cy="300" r="6"/><circle cx="74" cy="250" r="5.5"/><circle cx="58" cy="200" r="5"/><circle cx="44" cy="150" r="4.5"/><circle cx="52" cy="100" r="4"/><circle cx="58" cy="60" r="3.5"/></g></svg>`;

  function tentaculos(capa) {
    for (const lado of ['izq', 'der']) {
      const e = document.createElement('div');
      e.className = `tentaculo ${lado}`;
      e.innerHTML = TENTACULO;
      capa.append(e);
    }
  }

  function lineas(capa) {
    const e = document.createElement('div');
    e.className = 'barrido';
    capa.append(e);
  }

  // Retratos pintados con IA: se cargan al abrir el overlay (siempre abierto en
  // OBS) para que estén listos cuando aparezca el jefe. Sin imagen, el dibujo.
  const PINTADOS = {};
  const urlPintado = (tipo) => `../imagenes/jefes/${tipo}.png`;
  for (const tipo of Object.keys(TEMAS)) {
    const im = new Image();
    im.onload = () => {
      PINTADOS[tipo] = true;
      if (document.body.dataset.jefe === tipo) ponerRetrato(tipo);
    };
    im.src = urlPintado(tipo);
  }
  const RETRATO_PINTADO = (tipo) => `<defs><clipPath id="r-circ"><circle cx="100" cy="100" r="74"/></clipPath>
    <radialGradient id="r-furia"><stop offset=".45" stop-color="#ff2a10" stop-opacity="0"/><stop offset="1" stop-color="#ff1a00" stop-opacity=".9"/></radialGradient></defs>
    <g clip-path="url(#r-circ)"><image class="pintado" href="${urlPintado(tipo)}" x="22" y="22" width="156" height="156" preserveAspectRatio="xMidYMid slice"/>
    <circle class="furia" cx="100" cy="100" r="74" fill="url(#r-furia)"/></g>`;

  function ponerRetrato(tipo) {
    const t = TEMAS[tipo] || TEMA_BASE;
    $('retrato').innerHTML = PINTADOS[tipo] ? RETRATO_PINTADO(tipo) : (t.retrato || RETRATO_BASE);
    $('aviso-retrato').innerHTML = copiaEmblema('aviso');
  }

  /** El medallón para el aviso o el final, con sus ids renombrados: si no, sus
   *  recortes y degradados apuntarían a los de la barra, que se oculta al final. */
  function copiaEmblema(sufijo) {
    return $('emblema').innerHTML
      .replace(/id="([^"]+)"/g, `id="$1-${sufijo}"`)
      .replace(/url\(#([^)]+)\)/g, `url(#$1-${sufijo})`);
  }

  let glitchReloj = null;
  let cicloJefe = 0;
  let salidaJefe = null, salidaAmbiente = null, avisoReloj = null, salidaCartel = null;
  // 27 sep 2026: un callback del jefe anterior no puede retirar al nuevo.
  function cancelarRetirada() {
    for (const reloj of [salidaJefe, salidaAmbiente, avisoReloj, cartelReloj, salidaCartel]) clearTimeout(reloj);
    $('jefe').classList.remove('sale');
    $('ambiente').classList.remove('apagando');
    $('aviso').hidden = true;
    $('cartel-especial').hidden = true;
    $('cartel-especial').classList.remove('sale');
  }

  /** Viste la pantalla con el jefe: colores, retrato, insignia y ambiente. */
  function vestir(tipo) {
    const t = TEMAS[tipo] || TEMA_BASE;
    const raiz = document.body.style;
    ['--t1', '--t2', '--t3', '--tb', '--m1', '--m2'].forEach((v, i) => raiz.setProperty(v, t.c[i]));
    document.body.dataset.jefe = tipo || '';
    ponerRetrato(tipo);
    $('insignia').textContent = t.insignia;
    const capa = $('ambiente');
    capa.replaceChildren();
    t.ambiente(capa);
    clearInterval(glitchReloj);
    if (t.glitch) {
      glitchReloj = setInterval(() => {
        document.body.classList.add('glitch');
        const ciclo = cicloJefe;
        setTimeout(() => { if (ciclo === cicloJefe) document.body.classList.remove('glitch'); }, 260);
      }, 2600);
    }
  }

  /** Se va el jefe: fuera el ambiente. */
  function desvestir() {
    clearInterval(glitchReloj);
    document.body.classList.remove('glitch');
    const capa = $('ambiente');
    capa.classList.add('apagando');
    const ciclo = cicloJefe;
    salidaAmbiente = setTimeout(() => { if (ciclo !== cicloJefe) return; capa.replaceChildren(); capa.classList.remove('apagando'); }, 1200);
  }

  let actual = null;      // id del jefe que se está pintando
  let visto = 0;          // último golpe pintado
  let finalVisto = null;  // id del jefe cuyo final ya se enseñó
  let especialVisto = 0;  // último ataque especial enseñado
  let dueloVisto = null;  // último duelo enseñado (o puesto en la cola)
  const colaDuelos = [];
  let enseñandoDuelo = false;
  DirectoRed.alReiniciar(() => { ++cicloJefe; cancelarRetirada(); actual = null; visto = 0; finalVisto = null; especialVisto = 0; dueloVisto = null; colaDuelos.length = 0; $('jefe').hidden = true; });

  function pintar(d) {
    const j = d.jefe;
    if (j) {
      if (j.id !== actual) aparece(j);
      const pct = Math.max(0, (j.vida / j.vidaMax) * 100);
      if (pct < ultimoPct - 0.05) esquirla(pct, ultimoPct);
      ultimoPct = pct;
      $('vida').style.width = `${pct}%`;
      $('rastro').style.width = `${pct}%`;
      $('cifra').textContent = `${j.vida} / ${j.vidaMax}`;
      $('reloj').textContent = `⏳ ${mmss(j.quedanSeg)}`;
      $('reloj').classList.toggle('prisa', j.quedanSeg <= 30);
      $('jefe').classList.toggle('critica', pct <= 25);
      for (const g of j.golpes) if (g.n > visto) { numero(g); visto = g.n; }
      if (j.especial && j.especial.n > especialVisto) especial(j.especial);
      else if (!j.especial && !$('cartel-especial').hidden) quitarCartel();
      pintarAfectados(j.afectados || []);
    } else if (actual !== null) {
      actual = null;
      const ciclo = ++cicloJefe;
      // Se ha ido: pinta los últimos golpes (el que lo mató) y se retira.
      desvestir();
      quitarCartel();
      $('jefe').classList.add('sale');
      salidaJefe = setTimeout(() => { if (ciclo !== cicloJefe) return; $('jefe').hidden = true; $('jefe').classList.remove('sale'); }, 650);
    }
    if (d.final && d.final.id !== finalVisto) acaba(d.final);
    for (const duelo of d.duelos || []) {
      // Al cargar el overlay, los duelos que ya había no se repiten.
      if (dueloVisto === null) { dueloVisto = Math.max(...d.duelos.map((x) => x.n)); break; }
      if (duelo.n > dueloVisto) { dueloVisto = duelo.n; DirectoRed.encolar(colaDuelos, duelo); }
    }
    if (dueloVisto === null) dueloVisto = 0;
    siguienteDuelo();
  }

  // ---------- Duelos ----------

  const DUELO_MS = 7200;
  const ANIMA_RULETA_MS = 2000;

  function siguienteDuelo() {
    if (enseñandoDuelo || !colaDuelos.length) return;
    const siguiente = DirectoRed.extraer(colaDuelos);
    if (!siguiente) return;
    enseñandoDuelo = true;
    duelo(siguiente);
    setTimeout(() => { $('duelo').hidden = true; enseñandoDuelo = false; siguienteDuelo(); }, DUELO_MS);
  }

  function luchador(el, l) {
    el.querySelector('.quien').textContent = l.nombre;
    el.querySelector('.titulo').textContent = l.titulo ? `«${l.titulo}»` : '';
    el.querySelector('.poder').textContent = `⚔️ Poder ${l.poder}`;
    el.classList.remove('gana', 'pierde');
  }

  function duelo(d) {
    const caja = $('duelo');
    caja.classList.remove('resuelto');
    luchador($('d-a'), d.retador);
    luchador($('d-b'), d.rival);
    const pa = Math.round(d.prob * 100);
    $('d-pa').style.width = `${pa}%`;
    $('d-pb').style.width = `${100 - pa}%`;
    $('d-pcta').textContent = `${pa} %`;
    $('d-pctb').textContent = `${100 - pa} %`;
    $('d-extra').replaceChildren();
    caja.hidden = true; void caja.offsetWidth; caja.hidden = false;
    sonar('grito-de-guerra.wav');

    // La aguja: va y viene y se para en el lado de quien gana, dentro de su parte.
    const destino = d.ganaRetador ? 4 + Math.random() * Math.max(1, pa - 8) : pa + 4 + Math.random() * Math.max(1, 100 - pa - 8);
    const aguja = $('d-aguja');
    aguja.getAnimations().forEach((a) => a.cancel());
    aguja.animate(
      [{ left: '50%' }, { left: '8%' }, { left: '92%' }, { left: '25%' }, { left: '75%' }, { left: `${destino}%` }],
      { duration: ANIMA_RULETA_MS, delay: 1100, easing: 'cubic-bezier(.3, .1, .2, 1)', fill: 'forwards' },
    );

    setTimeout(() => {
      $(d.ganaRetador ? 'd-a' : 'd-b').classList.add('gana');
      $(d.ganaRetador ? 'd-b' : 'd-a').classList.add('pierde');
      const probGanador = d.ganaRetador ? d.prob : 1 - d.prob;
      const extra = [];
      if (probGanador < 0.4) { const e = document.createElement('span'); e.className = 'sorpresa'; e.textContent = '¡SORPRESA!'; extra.push(e); }
      if (d.maldito) {
        const e = document.createElement('span'); e.className = 'maldito';
        e.textContent = `☠️ ${d.maldito} pasa a ${d.ganaRetador ? d.retador.nombre : d.rival.nombre}`;
        extra.push(e);
      }
      $('d-extra').replaceChildren(...extra);
      caja.classList.add('resuelto');
      sonar('cofre.wav');
    }, 1100 + ANIMA_RULETA_MS + 150);
  }

  function aparece(j) {
    cancelarRetirada();
    ++cicloJefe;
    actual = j.id;
    // Los golpes de antes de que se cargara el overlay no se repiten.
    if (j.golpes.length) visto = Math.max(visto, ...j.golpes.map((g) => g.n));
    if (j.especial && !(j.vida === j.vidaMax && j.golpes.length === 0)) especialVisto = Math.max(especialVisto, j.especial.n - 1);
    const nombre = mayuscula(j.nombre);
    $('nombre').textContent = nombre;
    $('nombre').classList.toggle('largo', nombre.length > 24);
    $('aviso-nombre').textContent = nombre;
    vestir(j.tipo);
    ultimoPct = 100;
    // El aviso solo si acaba de aparecer; si el overlay se carga a mitad, directo a la barra.
    if (j.vida === j.vidaMax && j.golpes.length === 0) {
      $('aviso').hidden = false;
      sonar('terremoto.wav');
      const ciclo = cicloJefe;
      avisoReloj = setTimeout(() => { if (ciclo === cicloJefe) $('aviso').hidden = true; }, 3400);
    }
    const barra = $('jefe');
    barra.hidden = true; void barra.offsetWidth; barra.hidden = false;
  }

  let ultimoPct = 100;

  /** El trozo de barra que se pierde: salta y cae, y la barra da un respingo. */
  function esquirla(desde, hasta) {
    const barra = $('barra-vida');
    const ancho = barra.clientWidth;
    const e = document.createElement('div');
    e.className = 'esquirla';
    e.style.left = `${6 + (desde / 100) * ancho}px`;
    e.style.width = `${Math.max(4, ((hasta - desde) / 100) * ancho)}px`;
    e.style.setProperty('--dx', `${20 + Math.random() * 40}px`);
    e.style.setProperty('--giro', `${8 + Math.random() * 14}deg`);
    const marco = barra.parentElement;
    marco.append(e);
    setTimeout(() => e.remove(), 800);
    for (const el of [marco, barra]) { el.classList.remove('impacto'); void el.offsetWidth; el.classList.add('impacto'); }
  }

  function numero(g) {
    const el = document.createElement('div');
    const tipo = g.tipo || 'golpe';
    if (tipo === 'bloqueado' || tipo === 'fallo') {
      el.className = 'dano estado';
      const i = document.createElement('span'); i.className = 'icono'; i.textContent = g.icono || '';
      el.append(i, g.texto || '');
    } else if (tipo === 'cura') {
      el.className = 'dano cura';
      el.append(`${g.icono || ''} +${g.dano}`);
    } else if (tipo === 'propio') {
      el.className = 'dano propio';
      el.append(`${g.icono || ''} −${g.dano}`);
    } else {
      el.className = `dano${g.critico ? ' critico' : ''}${g.icono === '🐍' ? ' veneno' : ''}`;
      el.append(`${g.icono === '🐍' ? '🐍 ' : ''}-${g.dano}`);
    }
    const quien = document.createElement('small');
    quien.textContent = g.quien;
    el.append(quien);
    // Debajo de la barra, repartidos a lo ancho.
    el.style.left = `${700 + Math.random() * 700}px`;
    el.style.top = `${g.critico ? 205 : 220 + Math.random() * 50}px`;
    $('danos').append(el);
    setTimeout(() => el.remove(), 1600);
    if (tipo !== 'golpe' && tipo !== 'propio') return;
    const emblema = $('emblema');
    emblema.classList.remove('golpe'); void emblema.getBoundingClientRect(); emblema.classList.add('golpe');
    if (tipo !== 'golpe') return;
    if (g.critico && (TEMAS[document.body.dataset.jefe] || {}).temblor) {
      document.body.classList.remove('temblor'); void document.body.offsetWidth; document.body.classList.add('temblor');
    }
  }

  let cartelReloj = null;

  function especial(e) {
    clearTimeout(salidaCartel);
    especialVisto = e.n;
    $('ce-icono').textContent = e.icono;
    $('ce-titulo').textContent = e.titulo;
    $('ce-texto').textContent = e.texto;
    const cartel = $('cartel-especial');
    cartel.classList.remove('sale');
    cartel.hidden = true; void cartel.offsetWidth; cartel.hidden = false;
    const d = document.createElement('div');
    d.className = 'destello-jefe';
    document.body.append(d);
    setTimeout(() => d.remove(), 1200);
    sonar('maldicion.wav', 0.9);
    clearTimeout(cartelReloj);
    cartelReloj = setTimeout(quitarCartel, 5500);
  }

  function quitarCartel() {
    const cartel = $('cartel-especial');
    clearTimeout(cartelReloj);
    if (cartel.hidden || cartel.classList.contains('sale')) return;
    cartel.classList.add('sale');
    const ciclo = cicloJefe;
    salidaCartel = setTimeout(() => { if (ciclo !== cicloJefe) return; cartel.hidden = true; cartel.classList.remove('sale'); }, 400);
  }

  function pintarAfectados(lista) {
    const caja = $('afectados');
    caja.hidden = !lista.length;
    $('pista').hidden = lista.length > 0;
    caja.replaceChildren(...lista.map((a) => {
      const el = document.createElement('span');
      el.className = 'afectado';
      el.append(`${a.icono} ${a.quien}`);
      if (a.quedanSeg !== null) { const b = document.createElement('b'); b.textContent = `${a.quedanSeg} s`; el.append(b); }
      return el;
    }));
  }

  function acaba(f) {
    finalVisto = f.id;
    // Los números que quedaran volando taparían el rótulo.
    $('danos').replaceChildren();
    const derrotado = f.resultado === 'derrotado';
    const caja = $('final');
    caja.className = `final ${derrotado ? '' : 'escapa'}`;
    $('final-retrato').innerHTML = copiaEmblema('final');
    $('titular').textContent = derrotado ? '¡Derrotado!' : '¡Se escapa!';
    $('subtitulo').textContent = derrotado
      ? `${mayuscula(f.nombre)} ha caído`
      : `${mayuscula(f.nombre)} huye con ${f.vida} de vida`;
    const medallas = ['🥇', '🥈', '🥉'];
    $('podio').replaceChildren(...f.podio.map((p, i) => {
      const d = document.createElement('div');
      d.className = 'puesto';
      const m = document.createElement('div'); m.className = 'medalla'; m.textContent = medallas[i];
      const q = document.createElement('div'); q.className = 'quien'; q.textContent = p.quien;
      const c = document.createElement('div'); c.className = 'cuanto'; c.textContent = `${p.dano} de daño`;
      d.append(m, q, c);
      return d;
    }));
    caja.hidden = true; void caja.offsetWidth; caja.hidden = false;
    sonar(derrotado ? 'legendario.wav' : 'maldicion.wav');
    setTimeout(() => { if (finalVisto === f.id) caja.hidden = true; }, 9000);
  }

  // ---------- De dónde salen los datos ----------

  const params = new URLSearchParams(location.search);
  if (params.get('demo') === '1') demo();
  else if (params.get('demo') === 'duelo') demoDuelos();
  else {
    const api = new URL('/api/overlay/jefe', location.href);
    DirectoRed.overlay(api, pintar, 500);
  }

  /** Unos duelos de mentira, uno detrás de otro. */
  function demoDuelos() {
    const duelos = [
      { n: 1, retador: { nombre: 'crid4n', titulo: null, poder: 12 }, rival: { nombre: 'Crid4m', titulo: 'Cazatesoros', poder: 34 }, prob: 0.26, ganaRetador: true, maldito: null },
      { n: 2, retador: { nombre: 'Ana_la_Tanque', titulo: 'Trotamundos', poder: 40 }, rival: { nombre: 'Pepe', titulo: null, poder: 22 }, prob: 0.65, ganaRetador: true, maldito: 'Corona del Liche' },
      { n: 3, retador: { nombre: 'Pepe', titulo: null, poder: 9 }, rival: { nombre: 'crid4n', titulo: null, poder: 15 }, prob: 0.38, ganaRetador: false, maldito: null },
    ];
    pintar({ jefe: null, final: null, duelos: [] });
    duelos.forEach((d, i) => setTimeout(() => pintar({ jefe: null, final: null, duelos: duelos.slice(0, i + 1) }), 300 + i * 150));
  }

  /** Un combate de mentira: aparece, recibe golpes, cae y enseña el podio. */
  function demo() {
    const nombres = ['Crid4m', 'crid4n', 'Pepe', 'Ana_la_Tanque'];
    const vidaMax = 400;
    let vida = vidaMax, n = 0, segundos = 180;
    const golpes = [];
    const danos = {};
    const NOMBRES = { dragon: 'el Dragón de Escarcha', esqueleto: 'el Rey Esqueleto', hidra: 'la Hidra del Pantano', golem: 'el Gólem de Obsidiana', liche: 'el Liche sin Nombre', arana: 'la Araña Reina', kraken: 'el Kraken del Foso', minotauro: 'el Minotauro con Resaca', tanque: 'el Tanque que no sabe tanquear', lag: 'el Lag Primigenio' };
    const tipos = Object.keys(NOMBRES);
    const tipo = NOMBRES[params.get('jefe')] ? params.get('jefe') : tipos[Math.floor(Math.random() * tipos.length)];
    const nombre = NOMBRES[tipo];
    let especialDemo = null, afectado = null;
    const ESPECIALES_DEMO = {
      dragon: ['❄️', 'Aliento helado', 'congelado 15 s', '¡CONGELADO!'], esqueleto: ['💀', 'Alzar a los muertos', null, null],
      hidra: ['🐍', 'Mordisco venenoso', 'la mitad de daño 20 s', null], golem: ['🗿', 'Terremoto', 'aturdido 8 s', '¡ATURDIDO!'],
      liche: ['☠️', 'Drenar alma', null, null], arana: ['🕸️', 'Telaraña', 'atrapado 15 s', '¡ATRAPADO!'],
      kraken: ['🐙', 'Tentáculo', 'al fondo 15 s', '¡AL FONDO!'], minotauro: ['🤢', 'Vomitona', null, null],
      tanque: ['🛡️', 'Provocación fallida', null, null], lag: ['📶', 'Desconexión', 'desconectado 15 s', '¡DESCONECTADO!'],
    };
    function lanzarEspecialDemo(quien) {
      const [icono, titulo, efecto, texto] = ESPECIALES_DEMO[tipo];
      let linea = efecto ? `${quien}, ${efecto}` : 'Todos fallan el siguiente golpe';
      if (tipo === 'esqueleto' || tipo === 'liche') { vida = Math.min(vidaMax, vida + 60); linea = '+60 de vida'; golpes.push({ n: ++n, quien: nombre, dano: 60, critico: false, tipo: 'cura', icono }); }
      if (tipo === 'tanque') { vida = Math.max(1, vida - 48); linea = 'Se pega solo: −48'; golpes.push({ n: ++n, quien: nombre, dano: 48, critico: false, tipo: 'propio', icono }); }
      if (texto) afectado = { quien, icono, texto, hasta: Date.now() + 6000 };
      especialDemo = { n: 1, icono, titulo, texto: linea, at: Date.now() };
    }
    const estado = () => ({
      jefe: vida > 0 ? {
        id: 1, tipo, nombre, vida, vidaMax, quedanSeg: segundos, golpes: golpes.slice(-20),
        especial: especialDemo && Date.now() - especialDemo.at < 6000 ? especialDemo : null,
        afectados: afectado && afectado.hasta > Date.now() ? [{ quien: afectado.quien, icono: afectado.icono, quedanSeg: Math.ceil((afectado.hasta - Date.now()) / 1000) }] : [],
      } : null,
      final: null,
    });
    pintar(estado());
    if (params.get('quieto') === '1') return;
    setTimeout(function pega() {
      const quien = nombres[Math.floor(Math.random() * nombres.length)];
      const critico = Math.random() < 0.15;
      const dano = Math.round((8 + Math.random() * 14) * (critico ? 2 : 1));
      // Congelado (o lo que toque): sus golpes no llegan mientras dure.
      if (afectado && afectado.quien === quien && afectado.hasta > Date.now()) {
        golpes.push({ n: ++n, quien, dano: 0, critico: false, tipo: 'bloqueado', icono: afectado.icono, texto: afectado.texto });
        pintar(estado());
        return setTimeout(pega, 450 + Math.random() * 500);
      }
      vida = Math.max(0, vida - dano); segundos = Math.max(0, segundos - 3);
      golpes.push({ n: ++n, quien, dano, critico, tipo: 'golpe' });
      if (!especialDemo && vida > 0 && vida <= vidaMax * 0.6) lanzarEspecialDemo(quien);
      danos[quien] = (danos[quien] || 0) + dano;
      pintar(estado());
      if (vida > 0) return setTimeout(pega, 450 + Math.random() * 500);
      const podio = Object.entries(danos).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([quien, dano]) => ({ quien, dano }));
      setTimeout(() => pintar({ jefe: null, final: { id: 1, tipo, nombre, resultado: 'derrotado', vida: 0, vidaMax, podio } }), 700);
    }, 3800);
  }
