<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Linde del Velo · boceto de dirección visual</title>
<style>
@font-face{font-family:cinzel;src:url('../../../biblioteca/imagenes/combate/fuentes/CinzelDecorative-Bold.ttf')}
@font-face{font-family:raj;src:url('../../../biblioteca/imagenes/combate/fuentes/Rajdhani-Bold.ttf')}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090911;color:#fff7e6}body{font-family:raj,'Segoe UI',sans-serif}.stage{position:absolute;width:1920px;height:1080px;overflow:hidden;transform-origin:top left;background:#090911}.land{position:absolute;inset:-20px;background:url('../../../biblioteca/imagenes/mmo/bosque.png') center/cover;filter:brightness(.68) saturate(.82);transform:scale(1.035);animation:drift 35s ease-in-out infinite alternate}.stage[data-scene=calma] .land{background-image:url('../../../biblioteca/imagenes/mmo/refugio.png');filter:brightness(.74) saturate(.84)}.stage[data-scene=victoria] .land{filter:brightness(.83) saturate(1.08)}@keyframes drift{to{transform:scale(1.08) translate(-12px,-7px)}}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#080710bb 0%,transparent 32%,transparent 66%,#0807108c 100%),linear-gradient(0deg,#080710ed,transparent 24%,transparent 74%,#080710a6)}.mist{position:absolute;inset:0;background:radial-gradient(ellipse at 53% 60%,transparent 20%,#aaa2c826 55%,transparent 78%);mix-blend-mode:screen;animation:breathe 7s ease-in-out infinite alternate}@keyframes breathe{to{opacity:.4;transform:scale(1.12)}}.stage[data-scene=calma] .mist{opacity:.38}.stage[data-scene=victoria] .mist{background:radial-gradient(ellipse at 50% 70%,#ffbf6e4d,transparent 55%)}.rune{position:absolute;left:690px;top:155px;width:540px;height:630px;border-radius:50%;border:4px solid #b8d5d574;box-shadow:0 0 30px #b1dcd899,0 0 100px #beded370,inset 0 0 90px #bdccdf60;opacity:.6;transform:perspective(650px) rotateY(-20deg);animation:portal 5s ease-in-out infinite alternate}.rune:before{content:'';position:absolute;inset:16px;border:2px dashed #e3e5cf8c;border-radius:50%}.rune:after{content:'';position:absolute;inset:58px;border-radius:50%;background:radial-gradient(ellipse,#eacb9f18,#b5e0db2b 48%,transparent 70%)}@keyframes portal{to{opacity:.9;filter:hue-rotate(14deg);transform:perspective(650px) rotateY(-20deg) scale(1.025)}}.stage[data-scene=calma] .rune{left:1340px;top:215px;width:340px;height:450px;opacity:.22}.stage[data-scene=victoria] .rune{box-shadow:0 0 55px #ffe1a8,0 0 160px #ffca65,inset 0 0 110px #fff1cc;opacity:1}.particles{position:absolute;inset:0;pointer-events:none}.particles i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#ffd18c;box-shadow:0 0 20px #ffb762;opacity:.7;animation:float var(--d) linear infinite}@keyframes float{to{transform:translate(20px,-120px);opacity:0}}.top{position:absolute;top:42px;left:58px;right:58px;display:flex;align-items:flex-start;justify-content:space-between}.brand{font:700 24px cinzel,Georgia,serif;letter-spacing:.15em;color:#f6dbab;text-shadow:0 2px 20px #000}.place{display:block;margin-top:12px;font:700 52px cinzel,Georgia,serif;letter-spacing:.02em;color:#fff3cf;text-shadow:0 4px 18px #000}.status{font-size:23px;letter-spacing:.18em;color:#efc484;text-transform:uppercase;text-align:right}.status b{display:block;margin-top:9px;font-size:33px;color:#fff5e0;letter-spacing:.03em;text-transform:none}.route{position:absolute;left:295px;right:315px;bottom:145px;height:185px;display:flex;align-items:end;justify-content:space-between}.route:before{content:'';position:absolute;left:10%;right:10%;bottom:49px;height:5px;background:linear-gradient(90deg,#e5ab60,#d9b884,#91ded5);box-shadow:0 0 20px #ffe2a0;transform:rotate(-2deg);opacity:.82}.route span{position:relative;z-index:1;width:105px;height:105px;display:grid;place-items:center;border:2px solid #f6d49c;border-radius:50%;background:#171321d9;box-shadow:0 0 0 9px #10101a70,0 0 24px #ffca81;color:#fff4d6;font-size:34px}.route span small{position:absolute;top:113px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:21px;color:#fff0d3;text-shadow:0 2px 9px #000}.route .dark{border-color:#a9b8bb8c;color:#acc6c7;box-shadow:0 0 0 9px #10101a70}.stage[data-scene=calma] .route{opacity:.45}.stage[data-scene=victoria] .route span{border-color:#fff0b6;box-shadow:0 0 0 9px #10101a70,0 0 45px #ffd47e}.hero{position:absolute;left:715px;bottom:235px;width:225px;height:315px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 18px 12px #000) drop-shadow(0 0 18px #ffcb8499)}.hero.two{left:975px;width:205px;filter:drop-shadow(0 18px 12px #000) drop-shadow(0 0 18px #b4e7e799)}.stage[data-scene=calma] .hero{display:none}.speech{position:absolute;left:650px;bottom:560px;padding:15px 26px;background:#10101ad9;border-left:4px solid #f6c17c;border-radius:4px 15px 15px 4px;box-shadow:0 12px 30px #0008;font-size:27px}.speech b{color:#ffd991}.stage[data-scene=calma] .speech,.stage[data-scene=victoria] .speech{display:none}.mission{position:absolute;left:58px;bottom:345px;max-width:540px;text-shadow:0 3px 14px #000}.eyebrow{font-size:22px;letter-spacing:.25em;color:#f2c986;text-transform:uppercase}.mission h1{margin:8px 0;font:700 43px cinzel,Georgia,serif;line-height:1.15}.mission p{margin:8px 0;font-size:28px;color:#f3e5ca}.stage[data-scene=calma] .mission{bottom:370px;max-width:650px}.stage[data-scene=calma] .mission h1{font-size:61px}.stage[data-scene=victoria] .mission{bottom:400px;max-width:650px}.stage[data-scene=victoria] .mission h1{font-size:60px}.call{position:absolute;left:58px;bottom:52px;padding:13px 20px 10px;border-left:4px solid #ffc980;background:#0d0b15ca;font-size:29px;box-shadow:0 6px 25px #0008}.call b{color:#ffe2a3}.clock{position:absolute;right:58px;bottom:52px;text-align:right;font-size:28px;text-shadow:0 2px 12px #000}.clock b{display:block;font-size:46px;line-height:1;color:#ffe2ad}.stage[data-scene=victoria] .clock{display:none}.relic{display:none;position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;border:3px solid #ffebb8;box-shadow:0 0 40px #ffedb8,0 0 125px #ffc668,inset 0 0 35px #ffe7aa;background:radial-gradient(circle,#fff7d8,#ffc87155 35%,transparent 70%);place-items:center;font-size:80px;text-shadow:0 0 25px #fff}.stage[data-scene=victoria] .relic{display:grid}.stage[data-scene=calma] .call{font-size:37px}.note{position:absolute;top:170px;right:58px;max-width:350px;font-size:24px;text-align:right;color:#e7d8bf;text-shadow:0 2px 12px #000}.stage[data-scene=victoria] .note{color:#ffdda1}.scene-nav{position:fixed;z-index:10;left:16px;top:16px;display:flex;gap:8px}.scene-nav a{background:#111b;color:#fff;padding:5px 9px;border-radius:4px;font:14px Arial;text-decoration:none}.scene-nav a.active{background:#ad7835}body.capture .scene-nav{display:none}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<nav class="scene-nav"><a href="?escena=calma">Calma</a><a href="?escena=aporte">Aporte</a><a href="?escena=victoria">Victoria</a></nav>
<main class="stage" id="stage">
  <div class="land"></div><div class="shade"></div><div class="mist"></div><div class="rune"></div><div class="particles" id="particles"></div>
  <header class="top"><div><div class="brand">EL LINDE DEL VELO</div><strong class="place" id="place"></strong></div><div class="status" id="status"></div></header>
  <aside class="note" id="note"></aside>
  <section class="mission"><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1><p id="subline"></p></section>
  <div class="speech"><b>Ana</b> aparta las raíces y abre el paso</div>
  <img class="hero" src="../../../biblioteca/imagenes/mmo/avatares/guardabosques.png" alt=""><img class="hero two" src="../../../biblioteca/imagenes/mmo/avatares/explorador-errante.png" alt="">
  <div class="relic">✦</div>
  <div class="route"><span>✦<small>La Lumbre</small></span><span>◆<small>Primer paso</small></span><span>◆<small>Raíces</small></span><span id="last">◇<small>El claro</small></span></div>
  <div class="call" id="call"></div><div class="clock" id="clock"></div>
</main>
<script>
const qs=new URLSearchParams(location.search),scene=['calma','aporte','victoria'].includes(qs.get('escena'))?qs.get('escena'):'aporte';
document.body.classList.toggle('capture',qs.has('captura'));
const stage=document.getElementById('stage');stage.dataset.scene=scene;
const values={
 calma:{place:'La Última Lumbre',status:'EL MUNDO DESCANSA<b>La próxima salida te espera</b>',note:'La luz del campamento guía el camino cuando el Velo se abre.',eyebrow:'UNA AVENTURA DEL CHAT',headline:'La Lumbre sigue encendida',subline:'Una sola persona puede iniciar la próxima expedición.',call:'Escribe <b>!explorar</b> para cruzar el Velo',clock:'PRÓXIMA REGIÓN<b>Fronda Ámbar</b>'},
 aporte:{place:'Fronda Ámbar',status:'EXPEDICIÓN EN CURSO<b>3 de 4 pasos</b>',note:'Cada paso abre una marca en el sendero.',eyebrow:'OBJETIVO DE LA COMPAÑÍA',headline:'Abrir camino entre las raíces',subline:'Ana acaba de despejar un tramo del sendero.',call:'Ayuda con <b>!explorar</b> · Falta 1 paso',clock:'EL VELO SE CIERRA EN<b>13:55</b>'},
 victoria:{place:'Fronda Ámbar',status:'EXPEDICIÓN COMPLETADA<b>El camino está abierto</b>',note:'Nueva reliquia para la Lumbre: la Semilla de Ámbar.',eyebrow:'LA COMPAÑÍA LO HA CONSEGUIDO',headline:'El claro despierta',subline:'El Velo revela una reliquia entre las raíces.',call:'Mira tu renombre con <b>!expedicion</b>',clock:''}
};for(const [id,value] of Object.entries(values[scene]))document.getElementById(id).innerHTML=value;
if(scene==='aporte')document.getElementById('last').classList.add('dark');
if(scene==='calma')for(const node of document.querySelectorAll('.route span:not(:first-child)'))node.classList.add('dark');
const p=document.getElementById('particles');for(let i=0;i<28;i++){const e=document.createElement('i');e.style.cssText=`--x:${(i*37)%100}%;--y:${(i*53)%95}%;--s:${2+i%4}px;--d:${5+i%7}s;animation-delay:-${i%9}s`;p.append(e)}
function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;stage.style.left=`${Math.max(0,(innerWidth-1920*Math.min(innerWidth/1920,innerHeight/1080))/2)}px`;stage.style.top=`${Math.max(0,(innerHeight-1080*Math.min(innerWidth/1920,innerHeight/1080))/2)}px`};addEventListener('resize',fit);fit();document.querySelectorAll('.scene-nav a').forEach(a=>a.classList.toggle('active',a.href.includes(scene)));
</script>
</body>
</html>
