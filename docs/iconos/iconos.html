<!doctype html>
<!--
  Iconos de Twitch del canal: la moneda de los puntos (Oro) y las recompensas.

  Esta página es la FUENTE. Los PNG de biblioteca/imagenes/ salen de aquí:
  se abre en Edge sin ventana, se hace captura y se recortan con ImageMagick
  (ver docs/iconos/README.md). Para cambiar un icono, se cambia su SVG aquí.

  Estilo común: contorno oscuro grueso, colores vivos, formas simples.
  Tienen que leerse a 28×28 píxeles, que es como los ve el chat en el móvil.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .hoja { display: grid; grid-template-columns: repeat(5, 512px); }
  svg { width: 512px; height: 512px; display: block; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="oro" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff4c2"/><stop offset=".45" stop-color="#f5c542"/><stop offset="1" stop-color="#b07410"/>
    </radialGradient>
    <linearGradient id="acero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d7dee8"/><stop offset="1" stop-color="#8e9aab"/>
    </linearGradient>
    <linearGradient id="madera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8743a"/><stop offset="1" stop-color="#6e3d17"/>
    </linearGradient>
    <radialGradient id="sangre" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ff8aa0"/><stop offset=".5" stop-color="#e8264a"/><stop offset="1" stop-color="#8f0a24"/>
    </radialGradient>
    <radialGradient id="hueso" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e9e2f5"/><stop offset="1" stop-color="#a99bc4"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b86bff" stop-opacity=".9"/><stop offset="1" stop-color="#b86bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cristal" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#e9f6ff"/><stop offset=".4" stop-color="#7cc4ff"/><stop offset=".85" stop-color="#5b3fd6"/><stop offset="1" stop-color="#2d1a7a"/>
    </radialGradient>
    <linearGradient id="roca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a6a"/><stop offset="1" stop-color="#6f4a2a"/>
    </linearGradient>
    <radialGradient id="concha" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe0a8"/><stop offset=".55" stop-color="#e59a3c"/><stop offset="1" stop-color="#8f4f12"/>
    </radialGradient>
    <linearGradient id="naranja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e8661a"/>
    </linearGradient>
  </defs>
</svg>

<div class="hoja">

<!-- 1. ORO: la moneda de los puntos de canal -->

  <path d="M40 76 L36 46 L52 58 L64 38 L76 58 L92 46 L88 76 Z" fill="#c9880f" stroke="#3a2404" stroke-width="5" stroke-linejoin="round"/>

</svg>
